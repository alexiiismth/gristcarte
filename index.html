    <button id="password-gate-submit">Valider</button>
    <div class="password-gate-error" id="password-gate-error">Mot de passe incorrect.</div>
    <div class="password-gate-divider">ou</div>

  </div>

<div id="map-content-wrapper">
<div id="map"></div>

<script>
// -------------------------------------------------------------------
// Protection par mot de passe du widget
// -------------------------------------------------------------------
(function () {
  var CORRECT_PASSWORD = 'VSCCerema49';
  var STORAGE_KEY = 'cerema-carte-widget-mode'; // valeurs possibles : 'admin' | 'travaux'

  function showModeTravauxBadge() {
    if (document.getElementById('mode-travaux-badge')) return;
    var badge = document.createElement('div');
    badge.id = 'mode-travaux-badge';
    badge.className = 'mode-travaux-badge';
    badge.textContent = '🚧 Mode travaux — enregistrement uniquement';
    document.body.appendChild(badge);
  }

  function unlock(mode) {
    window.__modeTravaux = (mode === 'travaux');
    if (window.__modeTravaux) {
      document.body.classList.add('mode-travaux');
      showModeTravauxBadge();
    }
    document.getElementById('password-gate-overlay').style.display = 'none';
    document.getElementById('map-content-wrapper').style.display = 'block';
    try { sessionStorage.setItem(STORAGE_KEY, mode); } catch (e) {}
    // Laisse le temps au conteneur d'être visible avant que Leaflet calcule sa taille
    setTimeout(function () {
      try {
        if (typeof map !== 'undefined' && map && typeof map.invalidateSize === 'function') {
          map.invalidateSize();
        }
      } catch (e) {}
    }, 100);
  }

  function tryPassword() {
    var input = document.getElementById('password-gate-input');
    var error = document.getElementById('password-gate-error');
    if (input.value === CORRECT_PASSWORD) {
      unlock('admin');
    } else {
      error.classList.add('visible');
      input.value = '';
      input.focus();
    }
  }

  // Si déjà déverrouillé plus tôt dans cette session de navigation, on saute l'écran
  var savedMode = null;
  try { savedMode = sessionStorage.getItem(STORAGE_KEY); } catch (e) {}

  if (savedMode === 'admin' || savedMode === 'travaux') {
    unlock(savedMode);
  } else {
    document.getElementById('password-gate-submit').addEventListener('click', tryPassword);
    document.getElementById('password-gate-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryPassword();
    });
    document.getElementById('password-gate-travaux-btn').addEventListener('click', function () {
      unlock('travaux');
    });
  }
})();

// -------------------------------------------------------------------
// 1) Parsing WKT : gère POLYGON(...) et MULTIPOLYGON(...), avec trous
// -------------------------------------------------------------------

// Découpe une chaîne en groupes de parenthèses de niveau 1 : "(a),(b)" -> ["(a)","(b)"]
function splitTopLevelParens(str) {
  const result = [];
  let depth = 0, start = -1;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '(') {
      if (depth === 0) start = i;
      depth++;
    } else if (c === ')') {
      depth--;
      if (depth === 0) result.push(str.slice(start + 1, i)); // sans les parenthèses
    }
  }
  return result;
}

// "lon lat, lon lat, ..." -> [[lat,lon], [lat,lon], ...] (Leaflet veut [lat, lon])
function parseRing(ringStr) {
  return ringStr.split(',').map(pair => {
    const parts = pair.trim().split(/\s+/).map(Number);
    return [parts[1], parts[0]]; // inverse lon/lat -> lat/lon
  });
}

// Retourne un tableau de polygones Leaflet-ready : [ [ring1, ring2(trou), ...], ... ]
function parseWKT(wkt) {
  if (!wkt || typeof wkt !== 'string') return [];
  wkt = wkt.trim();
  const upper = wkt.toUpperCase();

  try {
    if (upper.startsWith('MULTIPOLYGON')) {
      const outer = wkt.slice(wkt.indexOf('(') + 1, wkt.lastIndexOf(')'));
      // outer = "((ring1),(ring2)),((ring1))"
      const polygons = splitTopLevelParens(outer);
      return polygons.map(polyStr => {
        const rings = splitTopLevelParens(polyStr);
        return rings.map(parseRing);
      });
    }
    if (upper.startsWith('POLYGON')) {
      const outer = wkt.slice(wkt.indexOf('(') + 1, wkt.lastIndexOf(')'));
      const rings = splitTopLevelParens(outer);
      return [rings.map(parseRing)];
    }
  } catch (e) {
    console.error('Erreur de parsing WKT:', wkt, e);
  }
  return [];
}

// -------------------------------------------------------------------
// 2) Initialisation de la carte
// -------------------------------------------------------------------

const map = L.map('map').setView([46.6, 2.4], 6); // vue par défaut : France

const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
});

let satelliteActive = false;
function toggleSatellite() {
  satelliteActive = !satelliteActive;
  if (satelliteActive) {
    map.removeLayer(osmLayer);
    satelliteLayer.addTo(map);
  } else {
    map.removeLayer(satelliteLayer);
    osmLayer.addTo(map);
  }
  const btn = document.getElementById('map-satellite-btn');
  if (btn) btn.classList.toggle('active', satelliteActive);
}

// Encart de crédit, affiché à côté des boutons de zoom (haut à gauche)
const creditControl = L.control({ position: 'topleft' });
creditControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'map-credit-badge');
  div.textContent = 'Carte interactive développée par l\'agence d\'Angers du Cerema';
  L.DomEvent.disableClickPropagation(div);
  return div;
};
creditControl.addTo(map);

// -------------------------------------------------------------------
// Outil de mesure de distance
// -------------------------------------------------------------------

let measureModeActive = false;
let measureStartLatLng = null;
let measureLine = null;
let measureLabelMarker = null;
const measureLayerGroup = L.layerGroup().addTo(map);

function formatDistance(meters) {
  if (meters < 1000) return Math.round(meters) + ' m';
  return (meters / 1000).toFixed(2) + ' km';
}

function makeMeasureLabelIcon(text) {
  return L.divIcon({
    className: 'measure-label-icon',
    html: '<div class="measure-label">' + text + '</div>',
    iconSize: [0, 0]
  });
}

function updateMeasureLine(latlng) {
  if (!measureLine || !measureStartLatLng) return;
  measureLine.setLatLngs([measureStartLatLng, latlng]);
  const dist = map.distance(measureStartLatLng, latlng);
  const midLat = (measureStartLatLng.lat + latlng.lat) / 2;
  const midLng = (measureStartLatLng.lng + latlng.lng) / 2;
  if (measureLabelMarker) {
    measureLabelMarker.setLatLng([midLat, midLng]);
    measureLabelMarker.setIcon(makeMeasureLabelIcon(formatDistance(dist)));
  }
}

function onMeasureClick(latlng) {
  if (!measureStartLatLng) {
    // Premier clic : point de départ (on repart d'une mesure propre)
    measureLayerGroup.clearLayers();
    measureStartLatLng = latlng;
    measureLine = L.polyline([latlng, latlng], { color: '#e53935', weight: 3, dashArray: '6,8' }).addTo(measureLayerGroup);
    L.circleMarker(latlng, { radius: 5, color: '#e53935', fillColor: '#e53935', fillOpacity: 1, weight: 2 }).addTo(measureLayerGroup);
    measureLabelMarker = L.marker(latlng, { icon: makeMeasureLabelIcon('0 m'), interactive: false }).addTo(measureLayerGroup);
  } else {
    // Second clic : point d'arrivée, la mesure est figée
    updateMeasureLine(latlng);
    L.circleMarker(latlng, { radius: 5, color: '#e53935', fillColor: '#e53935', fillOpacity: 1, weight: 2 }).addTo(measureLayerGroup);
    measureStartLatLng = null;
    measureLine = null;
    measureLabelMarker = null;
  }
}

function toggleMeasureMode() {
  measureModeActive = !measureModeActive;
  const btn = document.getElementById('map-measure-btn');
  if (btn) btn.classList.toggle('active', measureModeActive);
  measureLayerGroup.clearLayers();
  measureStartLatLng = null;
  measureLine = null;
  measureLabelMarker = null;
  map.getContainer().style.cursor = measureModeActive ? 'crosshair' : '';
}

map.on('mousemove', function (e) {
  if (measureModeActive && measureStartLatLng) {
    updateMeasureLine(e.latlng);
  }
});

// Bouton "info" (guide d'utilisation), affiché à gauche du panneau de recherche, en haut à droite
function ensureInfoButton() {
  if (document.getElementById('map-info-button')) return;
  const btn = document.createElement('button');
  btn.id = 'map-info-button';
  btn.className = 'map-info-button';
  btn.title = 'Guide d\'utilisation de la carte';
  btn.textContent = 'ℹ️';
  btn.onclick = function () { window.showGuideModal(); };
  document.body.appendChild(btn);

// Détermine automatiquement la couleur d'un domaine à partir de mots-clés dans son "milieu"
// (évite d'avoir à lister exhaustivement chaque cas : quelques mots-clés représentatifs suffisent)
const MILIEU_KEYWORDS_BLEU = ['étang', 'etang', 'lac', 'marais', 'tourbière', 'tourbiere', 'vallée humide',
  'vallee humide', 'zone humide', 'mare', 'rivière', 'riviere', 'ruisseau', 'fleuve', 'plan d\'eau',
  'zone inondable', 'roselière', 'roseliere', 'étier', 'etier'];
const MILIEU_KEYWORDS_VERT = ['forêt', 'foret', 'bois', 'lande', 'prairie', 'bocage', 'pelouse', 'plaine',
  'friche', 'pâture', 'pature', 'verger', 'haie', 'zone agricole', 'clairière', 'clairiere', 'sous-bois'];
const MILIEU_KEYWORDS_ROUGE = ['coteau', 'carrière', 'carriere', 'site rocheux', 'rocher', 'falaise',
  'ancien site minier', 'mine', 'minier', 'affleurement', 'éboulis', 'eboulis', 'pierrier', 'ardoisière', 'ardoisiere'];

function classifyMilieuColor(milieu) {
  if (!milieu) return null;
  const text = normalizeForSearch(milieu);
  if (MILIEU_KEYWORDS_BLEU.some(k => text.includes(k))) return '#1565c0';
  if (MILIEU_KEYWORDS_VERT.some(k => text.includes(k))) return '#2e7d32';
  if (MILIEU_KEYWORDS_ROUGE.some(k => text.includes(k))) return '#c62828';
  return null;
}

// -------------------------------------------------------------------
// Couleur associée à un chiffre de notation (état structurel / sécurité usager)
// Échelle de 1 à 4 : 1=rouge (urgent), 2=orange, 3=vert clair, 4=vert foncé (bon état)
// -------------------------------------------------------------------

const GRADE_COLORS = {
  '1': '#e53935', // rouge
  '2': '#f57c00', // orange
  '3': '#66bb6a', // vert clair
  '4': '#1b5e20'  // vert foncé
};

// Détermine la couleur associée à un chiffre 1-4 (renvoie null si ce n'est pas un chiffre reconnu)
function gradeColor(value) {
  const num = (value || '').toString().trim();
  return GRADE_COLORS[num] || null;
}

// Construit le HTML d'un badge coloré pour un chiffre 1-4, ou le texte brut si non reconnu
function gradeBadge(value) {
  const color = gradeColor(value);
  const text = escapeHtml(value);
  if (!color) return text;
  return '<span class="grade-badge" style="background:' + color + '; color:#fff;">' + text + '</span>';
}

// -------------------------------------------------------------------
// Note générale de l'ouvrage = calculée automatiquement, PAS saisie directement.
// Règle : on prend la note la plus basse (la plus mauvaise) parmi les notes générales
// (1 à 4) renseignées sur les objets liés à l'ouvrage (groupe "Objet 1 à 6").
// Si aucun objet n'a de note renseignée, la note de l'ouvrage reste indéterminée ('—').
// -------------------------------------------------------------------
function computeOuvrageNoteGenerale(objetsListe) {
  let min = null;
  (objetsListe || []).forEach(o => {
    const num = parseInt((o.note || '').toString().trim(), 10);
    if (Number.isFinite(num) && num >= 1 && num <= 4) {
      if (min === null || num < min) min = num;
    }
  });
  return min === null ? '' : String(min);
}

// Calcule les statistiques de santé à partir du registre (dédupliqué par nom, un ouvrage = une seule fois)
// Note : les noms de variables (bon/surveiller/travaux/urgent) suivent l'ordre des chiffres 1→4,
// mais le sens réel est désormais 1=urgent … 4=très bon état (voir affichage dans showHealthModal)
function computePatrimoineHealthStats() {
  const seen = new Set();
  let bon = 0, surveiller = 0, travaux = 0, urgent = 0, nonRenseigne = 0, total = 0;

  window.__structureRegistry.forEach(entry => {
    const key = normalizeForSearch(entry.nom);
    if (seen.has(key)) return; // un ouvrage ne doit être comptée qu'une seule fois
    seen.add(key);
    total++;

    const num = (entry.etat || '').toString().trim();
    if (num === '1') bon++;
    else if (num === '2') surveiller++;
    else if (num === '3') travaux++;
    else if (num === '4') urgent++;
    else nonRenseigne++;
  });

  const totalConnu = bon + surveiller + travaux + urgent;
  return { bon, surveiller, travaux, urgent, nonRenseigne, total, totalConnu };
}

function healthBarHtml(label, count, totalConnu, color) {
  const pct = totalConnu > 0 ? Math.round((count / totalConnu) * 100) : 0;
  return (
    '<div class="health-row">' +
      '<div class="health-row-label">' + escapeHtml(label) + '</div>' +
      '<div class="health-row-bar-bg"><div class="health-row-bar" style="width:' + pct + '%; background:' + color + ';"></div></div>' +
      '<div class="health-row-pct">' + pct + '% <span class="health-row-count">(' + count + ')</span></div>' +
    '</div>'
  );
}

function ensureItineraryDatalist() {

function formatDuration(seconds) {
  const totalMin = Math.round(seconds / 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return h + 'h' + (m < 10 ? '0' : '') + m;
  return m + ' min';
}

function formatDistanceKm(meters) {
  return (meters / 1000).toFixed(1) + ' km';
}

function buildGoogleMapsItineraryUrl(points) {
  const origin = points[0].latlng.lat + ',' + points[0].latlng.lng;
  const destination = points[points.length - 1].latlng.lat + ',' + points[points.length - 1].latlng.lng;
  const waypoints = points.slice(1, -1).map(p => p.latlng.lat + ',' + p.latlng.lng).join('|');
  let url = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(origin) + '&destination=' + encodeURIComponent(destination);
  if (waypoints) url += '&waypoints=' + encodeURIComponent(waypoints);
  return url;
}

function buildAppleMapsItineraryUrl(points) {
  // Apple Plans ne supporte officiellement qu'une origine + une destination via URL.
  // Le chaînage "+to:" est une astuce non-officielle qui fonctionne dans la plupart des cas
  // récents de l'app, mais sans garantie totale sur toutes les versions.
  const saddr = points[0].latlng.lat + ',' + points[0].latlng.lng;
  const daddr = points.slice(1).map(p => p.latlng.lat + ',' + p.latlng.lng).join('+to:');
  return 'https://maps.apple.com/?saddr=' + encodeURIComponent(saddr) + '&daddr=' + encodeURIComponent(daddr).replace(/%2Bto%3A/g, '+to:');
}

window.__computeItinerary = async function () {
  const resultEl = document.getElementById('itinerary-result');
  if (!resultEl) return;
  resultEl.innerHTML = '<p>Calcul en cours…</p>';

  const inputs = Array.from(document.querySelectorAll('.itinerary-structure-input'));
  const names = inputs.map(i => i.value.trim()).filter(Boolean);

  if (names.length < 2) {
    resultEl.innerHTML = '<p class="itinerary-error">Merci de renseigner au moins 2 ouvrages.</p>';
    return;
  }

  const points = [];
  const notFound = [];
  names.forEach(name => {
    const match = window.__structureRegistry.find(e => normalizeForSearch(e.nom) === normalizeForSearch(name));
    if (match && match.marker) points.push({ name: match.nom, latlng: match.marker.getLatLng() });
    else notFound.push(name);
  });

  if (notFound.length > 0) {
    resultEl.innerHTML = '<p class="itinerary-error">Ouvrage(s) introuvable(s), vérifiez l\'orthographe : ' + notFound.map(escapeHtml).join(', ') + '</p>';
    return;
  }

  let legsHtml = '';
  let totalDurationSec = 0;
  let totalDistanceM = 0;
  let usedFallback = false;

  try {
    const coordsStr = points.map(p => p.latlng.lng + ',' + p.latlng.lat).join(';');
    const url = 'https://router.project-osrm.org/route/v1/driving/' + coordsStr + '?overview=false';
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.code !== 'Ok' || !data.routes || !data.routes[0]) throw new Error('Réponse OSRM invalide');
    const route = data.routes[0];
    totalDurationSec = route.duration;
    totalDistanceM = route.distance;
    legsHtml = route.legs.map((leg, i) =>
      '<div class="itinerary-leg">' + escapeHtml(points[i].name) + ' → ' + escapeHtml(points[i + 1].name) +
      ' : <b>' + formatDuration(leg.duration) + '</b> (' + formatDistanceKm(leg.distance) + ')</div>'
    ).join('');
  } catch (err) {
    console.warn('Calcul d\'itinéraire routier indisponible, estimation à vol d\'oiseau utilisée :', err);
    usedFallback = true;
    const AVG_SPEED_KMH = 60;
    for (let i = 0; i < points.length - 1; i++) {
      const d = map.distance(points[i].latlng, points[i + 1].latlng);
      const durationSec = (d / 1000) / AVG_SPEED_KMH * 3600;
      totalDurationSec += durationSec;
      totalDistanceM += d;
      legsHtml += '<div class="itinerary-leg">' + escapeHtml(points[i].name) + ' → ' + escapeHtml(points[i + 1].name) +
        ' : ~<b>' + formatDuration(durationSec) + '</b> (' + formatDistanceKm(d) + ')</div>';
    }
  }

  resultEl.innerHTML =
    (usedFallback ? '<p class="itinerary-warning">⚠️ Itinéraire routier indisponible : estimation à vol d\'oiseau (vitesse moyenne 60 km/h).</p>' : '') +
    '<div class="itinerary-legs">' + legsHtml + '</div>' +
    '<div class="itinerary-total">Total : <b>' + formatDuration(totalDurationSec) + '</b> — ' + formatDistanceKm(totalDistanceM) + '</div>' +
    '<div class="itinerary-nav-buttons">' +
      '<a class="btn btn-maps" href="' + buildGoogleMapsItineraryUrl(points) + '" target="_blank" rel="noopener">🗺️ Ouvrir dans Google Maps</a>' +
      '<a class="btn btn-maps" href="' + buildAppleMapsItineraryUrl(points) + '" target="_blank" rel="noopener">🍎 Ouvrir dans Plans (Apple Maps)</a>' +
    '</div>';
};

window.__computeWeather = async function () {
  const resultEl = document.getElementById('weather-result');
  if (!resultEl) return;

  const name = (document.getElementById('weather-structure-input') || {}).value || '';
  const dateStr = (document.getElementById('weather-date-input') || {}).value || '';

  if (!name.trim()) {
    resultEl.innerHTML = '<p class="weather-error">Merci de renseigner un ouvrage.</p>';
    return;
  }
  if (!dateStr) {
    resultEl.innerHTML = '<p class="weather-error">Merci de choisir un jour.</p>';
    return;
  }

  const match = window.__structureRegistry.find(e => normalizeForSearch(e.nom) === normalizeForSearch(name));
  if (!match || !match.marker) {
    resultEl.innerHTML = '<p class="weather-error">Ouvrage introuvable, vérifiez l\'orthographe : ' + escapeHtml(name) + '</p>';
    return;
  }

  resultEl.innerHTML = '<p>Recherche de la météo en cours…</p>';

  const latlng = match.marker.getLatLng();
  const today = new Date().toISOString().slice(0, 10);
  // Passé -> API archive ; aujourd'hui ou futur -> API prévisions (fiable jusqu'à ~16 jours)
  const isPast = dateStr < today;
  const base = isPast
    ? 'https://archive-api.open-meteo.com/v1/archive'
    : 'https://api.open-meteo.com/v1/forecast';
  const url = base +
    '?latitude=' + latlng.lat +
    '&longitude=' + latlng.lng +
    '&start_date=' + dateStr +
    '&end_date=' + dateStr +
    '&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum,windspeed_10m_max' +
    '&timezone=Europe%2FParis';

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.daily || !data.daily.time || data.daily.time.length === 0) {
      throw new Error('Pas de données pour ce jour');
    }
    const code = data.daily.weathercode[0];
    const tmax = data.daily.temperature_2m_max[0];
    const tmin = data.daily.temperature_2m_min[0];
    const precip = data.daily.precipitation_sum[0];
    const wind = data.daily.windspeed_10m_max[0];
    const [icon, label] = describeWeatherCode(code);
    const dateFormatted = new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    resultEl.innerHTML =
      '<div class="weather-card">' +
        '<div class="weather-card-icon">' + icon + '</div>' +
        '<div>' +
          '<div class="weather-card-name">' + escapeHtml(match.nom) + '</div>' +
          '<div class="weather-card-date">' + escapeHtml(dateFormatted) + '</div>' +
          '<div class="weather-card-desc">' + escapeHtml(label) + '</div>' +
          '<div class="weather-card-temps">🌡️ ' + Math.round(tmin) + '°C — ' + Math.round(tmax) + '°C</div>' +
          '<div class="weather-card-extra">💧 ' + precip + ' mm de précipitations · 💨 vent max ' + Math.round(wind) + ' km/h</div>' +
        '</div>' +
      '</div>';
  } catch (err) {
    console.warn('Météo indisponible :', err);
    resultEl.innerHTML = '<p class="weather-error">Météo indisponible pour ce jour (trop éloigné dans le passé ou le futur, ou service momentanément inaccessible).</p>';
  }
};

function showCoordToast(message) {
  const existing = document.getElementById('coord-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'coord-toast';
  toast.className = 'coord-toast';
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => { toast.classList.add('coord-toast-hide'); }, 1500);
  setTimeout(() => { toast.remove(); }, 2000);
}

map.on('click', function (e) {
  if (measureModeActive) {
    onMeasureClick(e.latlng);
    return;
  }

  const lat = e.latlng.lat.toFixed(6);
  const lng = e.latlng.lng.toFixed(6);
  const coordText = lat + ', ' + lng;

  const onSuccess = () => showCoordToast('📋 Coordonnées copiées : ' + coordText);
  const onError = () => showCoordToast('⚠️ Impossible de copier automatiquement : ' + coordText);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(coordText).then(onSuccess).catch(onError);
  } else {
    // Repli pour les navigateurs/contextes ne supportant pas l'API Clipboard moderne
    try {
      const textarea = document.createElement('textarea');
      textarea.value = coordText;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      onSuccess();
    } catch (err) {
      onError();
    }
  }
});

// Récupère un jeton d'accès court terme pour construire les URLs de pièces jointes
async function getFreshAccessToken() {
  return await grist.docApi.getAccessToken({ readOnly: true });
}

// Décode le payload d'un JWT (sans vérifier la signature, juste pour en extraire des infos)
function decodeJwtPayload(token) {
  try {
    const payloadPart = token.split('.')[1];
    const base64 = payloadPart.replace(/-/g, '+').replace(/_/g, '/');
    const padded = base64 + '=='.slice(0, (4 - (base64.length % 4)) % 4);
    const json = atob(padded);
    return JSON.parse(json);
  } catch (e) {
    return null;
  }
}

function buildAttachmentUrl(tokenInfo, attachmentId) {
  let baseUrl = tokenInfo.baseUrl;

  // tokenInfo.baseUrl utilise parfois l'identifiant "court" du document (tel qu'affiché
  // dans l'URL du navigateur), qui ne correspond pas toujours à l'identifiant complet
  // attendu par l'API de téléchargement des pièces jointes. Le jeton d'accès (JWT), lui,
  // contient l'identifiant complet et fiable du document (docId) : on l'utilise pour
  // reconstruire l'URL de base si besoin.
  const payload = decodeJwtPayload(tokenInfo.token);
  if (payload && payload.docId) {
    baseUrl = baseUrl.replace(/\/docs\/[^/]+$/, '/docs/' + payload.docId);
  }

  return baseUrl + '/attachments/' + attachmentId + '/download?auth=' + tokenInfo.token;
}

// value peut être : vide, une URL en texte, ou un tableau d'ids (colonne Pièce jointe Grist)
function resolveImageValue(value, tokenInfo) {
  if (!value) return '';
  if (Array.isArray(value)) {
    if (value.length === 0) return '';
    // Ignore un éventuel préfixe d'encodage Grist ('L' pour "list") si présent en première position
    const items = (value[0] === 'L') ? value.slice(1) : value;
    if (items.length === 0) return '';
    const first = items[0];
    const id = typeof first === 'number' ? first : (typeof first === 'string' && /^\d+$/.test(first) ? Number(first) : null);
    if (id !== null && tokenInfo) return buildAttachmentUrl(tokenInfo, id);
    return '';
  }
  return String(value).trim();
}

// Extrait l'identifiant numérique de pièce jointe Grist depuis une valeur de cellule
// (même logique que resolveImageValue, mais retourne juste l'id, utile pour une éventuelle relance).
// Retourne null si la valeur n'est pas une pièce jointe Grist (ex: URL en texte).
function extractAttachmentId(value) {
  if (!value || !Array.isArray(value) || value.length === 0) return null;
  const items = (value[0] === 'L') ? value.slice(1) : value;
  if (items.length === 0) return null;
  const first = items[0];
  return typeof first === 'number' ? first : (typeof first === 'string' && /^\d+$/.test(first) ? Number(first) : null);
}

// Relance le chargement d'une image de pièce jointe avec un jeton tout frais, en cas d'échec.
// Utile car le jeton peut avoir expiré (15 min) entre sa récupération initiale et le moment
// réel où le navigateur charge l'image, notamment si le rendu de la page a pris du temps.
// Une seule tentative de relance (via dataset.retried), pour éviter une boucle infinie si
// le vrai problème est ailleurs (droits d'accès, pièce jointe supprimée, etc.).
window.__retryAttachmentImg = async function (imgEl, attachmentId) {
  if (imgEl.dataset.retried) {
    console.error('Échec de chargement (même après relance avec jeton frais), URL :', imgEl.src);
    imgEl.replaceWith(Object.assign(document.createElement('div'), { className: 'no-photo', textContent: 'Image inaccessible (voir console)' }));
    return;
  }
  imgEl.dataset.retried = '1';
  try {
    const freshToken = await getFreshAccessToken();
    imgEl.src = buildAttachmentUrl(freshToken, attachmentId);
  } catch (e) {
    console.error('Échec de la relance (impossible d\'obtenir un jeton frais) :', e);
    imgEl.replaceWith(Object.assign(document.createElement('div'), { className: 'no-photo', textContent: 'Image inaccessible (voir console)' }));
  }
};

// Convertit un texte en nombre en gérant la virgule décimale française ("43,6047" -> 43.6047)
function parseFrenchNumber(value) {
  if (value === null || value === undefined || value === '') return NaN;
  if (typeof value === 'number') return value;
  return Number(String(value).trim().replace(',', '.'));
}

// Clé de regroupement d'un ouvrage : par nom (prioritaire) sinon par coordonnées GPS arrondies
function structureGroupKey(mapped) {
  const name = (mapped.NomStructure || '').toString().trim().toLowerCase();
  if (name) return 'name:' + name;
  const lat = parseFrenchNumber(mapped.Latitude);
  const lng = parseFrenchNumber(mapped.Longitude);
  if (Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)) {
    return 'coord:' + lat.toFixed(5) + ',' + lng.toFixed(5);
  }
  return null;
}

// Essaie d'interpréter une date de visite (nombre Grist en secondes, texte JJ/MM/AAAA, ou texte générique)
function parseVisitDate(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') {
    const d = new Date(raw * 1000); // Grist encode les dates en secondes depuis epoch
    return isNaN(d.getTime()) ? null : d;
  }
  const str = String(raw).trim();
  const frMatch = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (frMatch) {
    const d = new Date(parseInt(frMatch[3], 10), parseInt(frMatch[2], 10) - 1, parseInt(frMatch[1], 10));
    return isNaN(d.getTime()) ? null : d;
  }
  const d2 = new Date(str);
  return isNaN(d2.getTime()) ? null : d2;
}

// Construit le libellé d'onglet "Visite du JJ/MM/AAAA"
function formatVisitLabel(raw) {
  const d = parseVisitDate(raw);
  if (d) return 'Visite du ' + d.toLocaleDateString('fr-FR');
  if (raw) return 'Visite du ' + String(raw);
  return 'Visite (date inconnue)';
}

// -------------------------------------------------------------------
// Détection géographique : un ouvrage est-elle à l'intérieur d'un polygone de domaine ?
// -------------------------------------------------------------------

// Test "point dans un anneau" par ray-casting. point = [lat, lng], ring = [[lat,lng], ...]
function pointInRing(point, ring) {
  const [py, px] = point; // on utilise (lat, lng) comme (y, x)
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1];
    const yj = ring[j][0], xj = ring[j][1];
    const intersect = ((yi > py) !== (yj > py)) &&
      (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// Un "polygone" ici = [anneauExterieur, trou1, trou2, ...] (format retourné par parseWKT)
function pointInPolygonWithHoles(point, rings) {
  if (!rings || rings.length === 0) return false;
  if (!pointInRing(point, rings[0])) return false; // pas dans l'anneau extérieur
  for (let i = 1; i < rings.length; i++) {
    if (pointInRing(point, rings[i])) return false; // dans un trou -> exclu
  }
  return true;
}

// Cherche le nom du premier domaine dont un des polygones contient ce point
function findDomaineForPoint(lat, lng, domainePolygonsList) {
  const point = [lat, lng];
  for (const entry of domainePolygonsList) {
    for (const rings of entry.polygons) {
      if (pointInPolygonWithHoles(point, rings)) return entry.name;
    }
  }
  return null;
}

// Convertit une valeur quelconque (texte, email, référence Grist, liste) en texte lisible
function formatTextValue(value) {
  if (value === null || value === undefined || value === '') return '';
  if (Array.isArray(value)) {
    // Ignore un éventuel préfixe d'encodage Grist ('L' pour "list")
    const items = (value[0] === 'L') ? value.slice(1) : value;
    return items.map(formatTextValue).filter(Boolean).join(', ');
  }
  if (typeof value === 'object') {
    const name = value.name || value.Name || value.label || '';
    const email = value.email || value.Email || '';
    const combined = [name, email].filter(Boolean).join(' - ');
    return combined || JSON.stringify(value);
  }
  return String(value);
}

// Formate une date pour l'affichage : gère les nombres (colonnes Date Grist = secondes epoch) et le texte brut
function formatDateValue(value) {
  if (value === null || value === undefined || value === '') return '';
  if (typeof value === 'number') {
    const d = new Date(value * 1000);
    if (!isNaN(d.getTime())) return d.toLocaleDateString('fr-FR');
  }
  return String(value);
}

// Retourne une clé de tri (timestamp) pour ordonner les visites de la plus récente à la plus ancienne
function dateSortKey(value) {
  if (typeof value === 'number') return value;
  if (typeof value === 'string' && value.trim() !== '') {
    const parsed = Date.parse(value);
    if (!isNaN(parsed)) return parsed / 1000;
  }
  return -Infinity;
}

// Échappe le texte pour éviter de casser le HTML si un nom contient des caractères spéciaux
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Résout une liste de photos (URL ou pièce jointe Grist) et retourne le HTML des emplacements
async function resolvePhotoSlotsHtml(photos) {
  let tokenInfo = null;
  let tokenError = '';
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
    tokenError = 'Erreur d\'accès aux pièces jointes : ' + (e && e.message ? e.message : e);
  }

  return photos.map((p, i) => {
    const hasRawValue = Array.isArray(p.url) ? p.url.length > 0 : !!p.url;
    const src = resolveImageValue(p.url, tokenInfo);
    const attachmentId = extractAttachmentId(p.url);
    let img;
    if (src) {
      const onerrorAttr = attachmentId !== null
        ? "window.__retryAttachmentImg(this, " + attachmentId + ")"
        : "console.error('Échec de chargement, URL :', this.src); this.replaceWith(Object.assign(document.createElement('div'), {className:'no-photo', textContent:'Image inaccessible (voir console)'}))";
      img = '<img src="' + escapeHtml(src) + '" alt="photo" referrerpolicy="no-referrer" onerror="' + onerrorAttr + '" />';
    } else if (hasRawValue && tokenError) {
      img = '<div class="no-photo">' + escapeHtml(tokenError) + '</div>';
      console.error('Photo ' + (i + 1) + ' : valeur brute présente mais non résolue ->', p.url);
    } else if (hasRawValue) {
      img = '<div class="no-photo">Format de pièce jointe non reconnu (voir console)</div>';
      console.error('Photo ' + (i + 1) + ' : format de valeur inattendu ->', p.url);
    } else {
      img = '<div class="no-photo">Aucune photo</div>';
    }
    const desc = '<div class="desc">' + escapeHtml(p.desc || '—') + '</div>';
    return '<div class="photo-slot">' + img + desc + '</div>';
  }).join('');
}

  // Attend que toutes les images soient réellement chargées (sinon l'impression peut se déclencher

  await waitForImagesToLoad(container);

};

// Attend que toutes les <img> d'un conteneur aient fini de charger (ou aient échoué), avant de continuer
function waitForImagesToLoad(container) {
  const imgs = Array.from(container.querySelectorAll('img'));
  return Promise.all(imgs.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  }));
}

// Construit le HTML des photos pour l'export PDF (ignore silencieusement les emplacements vides)
async function buildPdfPhotosHtml(photos) {

  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
  }

  const nonEmpty = (photos || []).filter(p => Array.isArray(p.url) ? p.url.length > 0 : !!p.url);
  if (nonEmpty.length === 0) return '<p class="pdf-no-photo">Aucune photo disponible.</p>';

  return nonEmpty.map(p => {
    const src = resolveImageValue(p.url, tokenInfo);
    const img = src ? '<img src="' + escapeHtml(src) + '" alt="photo" referrerpolicy="no-referrer" />' : '';
    const desc = p.desc ? '<div class="pdf-photo-desc">' + escapeHtml(p.desc) + '</div>' : '';
    return '<div class="pdf-photo-item">' + img + desc + '</div>';
  }).join('');
}

      jsStringLiteral(storeId) + ', ' + jsStringLiteral(ouvrageNom) + '); ' +
      'const t = document.querySelector(\'#photo-modal-overlay h3\'); if (t) t.textContent = ' +
      jsStringLiteral('🗂️ Objets — ' + (ouvrageNom || '')) + ';">← Retour à la liste des objets</a>' +
    '<div class="objet-fiche-photo"><p>Chargement de la photo…</p></div>' +
    (objet.type ? '<div class="modal-row"><b>Type :</b> ' + escapeHtml(objet.type) + '</div>' : '') +
    '<div class="modal-row"><b>Utilité / Description :</b> ' + escapeHtml(objet.utilite || '—') + '</div>' +
    '<button class="btn btn-form fiche-pdf-btn" onclick="window.exportObjetFicheToPdf()">🖨️ Exporter en PDF</button>';

  let tokenInfo = null;
  let tokenError = '';
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
    tokenError = 'Erreur d\'accès aux pièces jointes : ' + (e && e.message ? e.message : e);
  }

  const hasRawValue = Array.isArray(objet.photo) ? objet.photo.length > 0 : !!objet.photo;
  const src = resolveImageValue(objet.photo, tokenInfo);
  const attachmentId = extractAttachmentId(objet.photo);
  let photoHtml;
  if (src) {
    const onerrorAttr = attachmentId !== null
      ? "window.__retryAttachmentImg(this, " + attachmentId + ")"
      : "console.error('Échec de chargement, URL :', this.src); this.replaceWith(Object.assign(document.createElement('div'), {className:'no-photo', textContent:'Image inaccessible (voir console)'}))";
    photoHtml = '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(objet.nom) + '" referrerpolicy="no-referrer" onerror="' + onerrorAttr + '" />';
  } else if (hasRawValue && tokenError) {
    photoHtml = '<div class="no-photo">' + escapeHtml(tokenError) + '</div>';
  } else if (hasRawValue) {
    photoHtml = '<div class="no-photo">Format de pièce jointe non reconnu (voir console)</div>';
  } else {
    photoHtml = '<div class="no-photo">Aucune photo</div>';
  }

  // Le modal peut avoir été fermé, ou l'utilisateur peut être reparti à la liste, pendant le chargement
  const stillOpen = document.getElementById('photo-modal-overlay');
  if (stillOpen) {
    const photoZone = stillOpen.querySelector('.objet-fiche-photo');
    if (photoZone) photoZone.innerHTML = photoHtml;
  }
};

  const defaultBtns = document.getElementById('btns-default-' + objetUid);
  const objetBtnsContainer = document.getElementById('btns-objet-' + objetUid);
  if (!defaultBtns || !objetBtnsContainer) return;

  if (!selectedNom) {
    objetBtnsContainer.style.display = 'none';
    objetBtnsContainer.innerHTML = '';
    defaultBtns.style.display = 'flex';
    return;
  }

  const objets = window.__objetsStore[objetUid] || [];
  const objet = objets.find(o => o.nom === selectedNom);
  if (!objet) return;

  const selectId = 'select-' + objetUid;
  const warnId = 'warn-objet-' + Math.random().toString(36).slice(2);

  let btnFicheObjet, warningBox;
  if (objet.lienFiche) {
    btnFicheObjet = '<a class="btn btn-fiche" href="' + escapeHtml(objet.lienFiche) + '" target="_blank" rel="noopener">📄 Fiche de l\'objet</a>';

    warningBox = '<div class="warning-box" id="' + warnId + '">Aucune fiche n\'est liée à cet objet, veuillez en créer une pour accéder à ce paramètre.</div>';
  }

  const btnCreerObjet = objet.lienCreer
    ? '<a class="btn btn-form" href="' + escapeHtml(objet.lienCreer) + '" target="_blank" rel="noopener">➕ Créer une fiche à l\'objet</a>'
    : '';

    'window.__onObjetSelect(' + jsStringLiteral(objetUid) + ', \'\');">↩️ Retour</a>';

  objetBtnsContainer.innerHTML = btnFicheObjet + btnCreerObjet + btnRetour + warningBox;

// -------------------------------------------------------------------
// Calendrier des visites prévues
// -------------------------------------------------------------------
// La planification (quel ouvrage est prévue quel jour) reste enregistrée dans les OPTIONS du
// widget (grist.setOption / grist.onOptions), qui restent la source de vérité partagée entre
// utilisateurs. EN PLUS, à chaque modification, la ou les dates planifiées pour l'ouvrage concerné
// sont recopiées dans la colonne de table "DateVisitePlanifiee" (voir syncOuvrageCalendarColumn),
// afin que cette information soit aussi consultable/exploitable directement dans le tableau Grist.

const CALENDAR_WEEKDAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const CALENDAR_MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function calendarDateKey(year, monthIndex, day) { return year + '-' + pad2(monthIndex + 1) + '-' + pad2(day); }

// -------------------------------------------------------------------
// Helpers génériques : écriture directe dans des colonnes "Ouvrage" de la table Grist,
// à partir de leur nom "friendly" défini dans mapColumns (voir grist.ready plus bas).
// Réutilisé par le calendrier (colonne "DateVisitePlanifiee").
// -------------------------------------------------------------------
function getMappedRawColId(friendlyName) {
  const mappings = window.__gristMappings || {};
  const raw = mappings[friendlyName];
  if (!raw) return null;
  // Si la colonne autorise une sélection multiple, Grist renvoie un tableau : on prend le premier id.
  return Array.isArray(raw) ? (raw.length > 0 ? raw[0] : null) : raw;
}

async function updateOuvrageFields(rowId, friendlyValues) {
  if (rowId == null) return false;
  const fields = {};
  Object.keys(friendlyValues).forEach(function (friendlyName) {
    const colId = getMappedRawColId(friendlyName);
    if (colId) fields[colId] = friendlyValues[friendlyName];
  });
  if (Object.keys(fields).length === 0) return false; // colonnes non mappées : rien à écrire
  try {
    await grist.selectedTable.update({ id: rowId, fields: fields });
    return true;
  } catch (err) {
    console.error('Impossible de mettre à jour la ligne ouvrage n°' + rowId + ' :', err, fields);
    return false;
  }
}

// Recalcule, à partir de window.__visitPlanning, la liste des dates auxquelles cet ouvrage
// (identifié par son rowId de ligne Grist principale) est planifié, et l'enregistre dans la
// colonne de table "DateVisitePlanifiee" (dates séparées par ", ", ou vide si aucune planifiée).
async function syncOuvrageCalendarColumn(rowId) {
  if (rowId == null) return;
  const dates = [];
  Object.keys(window.__visitPlanning).forEach(function (dateKey) {
    (window.__visitPlanning[dateKey] || []).forEach(function (entry) {
      if (entry.rowId === rowId) dates.push(dateKey);
    });
  });
  dates.sort();
  const ok = await updateOuvrageFields(rowId, { DateVisitePlanifiee: dates.join(', ') });
  if (!ok) {
    showCoordToast('⚠️ Date non enregistrée dans le tableau : vérifiez que "🟥 Ouvrage — Date(s) de visite planifiée" est bien mappée (⚙️) vers une colonne de type Texte.');
  }
}

// Enregistre la planification courante dans les options du widget (persisté par Grist, partagé entre utilisateurs).
// Asynchrone et avec confirmation visuelle, car grist.setOption() est un appel réseau : sans l'attendre,
// un échec (ex. droits d'accès, connexion) passait inaperçu et la planification semblait "disparaître" au rafraîchissement.
async function saveVisitPlanning(showFeedback) {
  let ok = false;
  try {
    await grist.setOption('visitPlanning', window.__visitPlanning);
    ok = true;
  } catch (err) {
    console.error('Impossible d\'enregistrer la planification des visites dans les options du widget Grist :', err);
  }
  try {
    localStorage.setItem('cerema-visit-planning-backup', JSON.stringify(window.__visitPlanning));
  } catch (err) { /* pas grave, sauvegarde locale seulement en secours */ }

  if (showFeedback) {
    showCoordToast(ok ? '💾 Planification enregistrée' : '⚠️ Échec de l\'enregistrement, réessayez');
  }
  return ok;
}

// Fait clignoter en rouge (ou arrête de faire clignoter) le pin d'un ouvrage. Le clignotement
// est désormais déterminé UNIQUEMENT par la case "Clignote en rouge" de la visite la plus récente
// de l'ouvrage (voir la boucle de rendu des marqueurs), donc recalculé automatiquement à chaque
// rafraîchissement des données — aucune synchronisation manuelle n'est nécessaire ici.
function setOuvrageBlink(marker, urgent) {
  if (!marker || typeof marker.getElement !== 'function') return;
  const el = marker.getElement();
  if (!el) return;
  if (urgent) {
    el.classList.add('ouvrage-marker-urgent');
  } else {
    el.classList.remove('ouvrage-marker-urgent');
  }
}

        '<textarea id="travaux-prevoir-texte" rows="4" placeholder="Décrivez les travaux à prévoir pour cet ouvrage...">' + escapeHtml(existing.texte || '') + '</textarea>' +
        '<div class="travaux-prevoir-checkboxes">' +
          '<label><input type="checkbox" id="travaux-prevoir-standard"' + (existing.standard ? ' checked' : '') + '> <span class="label-standard">Travaux standard</span></label>' +
          '<label><input type="checkbox" id="travaux-prevoir-urgent"' + (existing.urgent ? ' checked' : '') + '> <span class="label-urgent">Travaux urgent</span></label>' +
        '</div>' +
        '<button id="travaux-prevoir-save-btn">💾 Enregistrer</button>' +
        '<div class="travaux-add-status" id="travaux-prevoir-status"></div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  const standardBox = document.getElementById('travaux-prevoir-standard');
  const urgentBox = document.getElementById('travaux-prevoir-urgent');
  // Les deux cases sont exclusives l'une de l'autre (un travail est soit standard, soit urgent)
  standardBox.addEventListener('change', function () {
    if (standardBox.checked) urgentBox.checked = false;
  });
  urgentBox.addEventListener('change', function () {
    if (urgentBox.checked) standardBox.checked = false;
  });

  document.getElementById('travaux-prevoir-save-btn').onclick = async function () {
    const saveBtn = this;
    const statusEl = document.getElementById('travaux-prevoir-status');
    const texte = document.getElementById('travaux-prevoir-texte').value.trim();
    const standard = standardBox.checked;
    const urgent = urgentBox.checked;

    saveBtn.disabled = true;
    saveBtn.textContent = 'Enregistrement…';
    statusEl.className = 'travaux-add-status';
    statusEl.textContent = '';

    if (!texte && !standard && !urgent) {
      delete window.__travauxAPrevoir[travauxPrevoirKey];
    } else {
      window.__travauxAPrevoir[travauxPrevoirKey] = { texte: texte, standard: standard, urgent: urgent };
    }

    const ok = await saveTravauxAPrevoir(false);
    // Remarque : cette case "urgent" ne pilote plus le clignotement du pin (voir la case
    // "Clignote en rouge" sur la fiche de la visite la plus récente) ; elle sert uniquement
    // de note de planification interne.

    saveBtn.disabled = false;
    saveBtn.textContent = '💾 Enregistrer';
    statusEl.className = 'travaux-add-status ' + (ok ? 'success' : 'error');
    statusEl.textContent = ok
      ? '✅ Travaux à prévoir enregistrés.'
      : '❌ Erreur lors de l\'enregistrement. Vérifiez que le widget a bien un accès complet au document.';
  };
};

function renderCalendarMonth() {
  const body = document.getElementById('calendar-modal-body');
  const label = document.getElementById('calendar-month-label');
  if (!body || !label) return;

  const viewDate = window.__calendarViewDate;
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  label.textContent = CALENDAR_MONTHS[month] + ' ' + year;

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // lundi = 0 ... dimanche = 6
  const gridStart = new Date(year, month, 1 - startOffset);

  const now = new Date();
  const todayKey = calendarDateKey(now.getFullYear(), now.getMonth(), now.getDate());

  let cellsHtml = '';
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const key = calendarDateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const isOtherMonth = cellDate.getMonth() !== month;
    const isToday = key === todayKey;
    const visits = window.__visitPlanning[key] || [];

    const chipsHtml = visits.map(function (v, vi) {
      return '<div class="calendar-visit-chip">' +
        '<span class="calendar-visit-chip-name" title="' + escapeHtml(v.nom) + '" onclick="window.__calendarGoToVisit(' + jsStringLiteral(key) + ', ' + vi + ')">' + escapeHtml(v.nom) + '</span>' +
        '<span class="calendar-visit-chip-remove" title="Retirer" onclick="window.__removeVisit(' + jsStringLiteral(key) + ', ' + vi + ')">&times;</span>' +
      '</div>';
    }).join('');

    cellsHtml +=
      '<div class="calendar-day' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + '">' +
        '<div class="calendar-day-top">' +
          '<span class="calendar-day-num">' + cellDate.getDate() + '</span>' +
          '<button class="calendar-day-add" title="Ajouter une visite ce jour" onclick="window.__openCalendarAddDialog(' + jsStringLiteral(key) + ')">+</button>' +
        '</div>' +
        '<div class="calendar-day-visits">' + chipsHtml + '</div>' +
      '</div>';
  }

  body.innerHTML =
    '<div class="calendar-weekdays">' + CALENDAR_WEEKDAYS.map(function (w) { return '<div class="calendar-weekday">' + w + '</div>'; }).join('') + '</div>' +
    '<div class="calendar-grid">' + cellsHtml + '</div>';
}

// ---- Export du planning du mois affiché en PDF (via la boîte de dialogue d'impression du navigateur) ----
// Réutilise le même conteneur #pdf-export-container que l'export de fiche de visite, pour bénéficier
// du même mécanisme d'impression déjà en place (masquage du reste de la page, mise en page A4/print).

// Construit le HTML de la grille imprimable pour un mois donné, à partir de la même
// planification (window.__visitPlanning) que celle affichée à l'écran.
function buildCalendarPrintHtml(year, month) {
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // lundi = 0 ... dimanche = 6
  const gridStart = new Date(year, month, 1 - startOffset);

  // N'affiche que les semaines contenant au moins un jour du mois exporté (pas de 6e ligne
  // uniquement composée de jours du mois suivant), et laisse les cases des mois adjacents
  // complètement vides (pas de numéro, pas de visite) pour ne pas les confondre avec le mois exporté.
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const numWeeks = Math.ceil((startOffset + daysInMonth) / 7);
  const totalCells = numWeeks * 7;

  let cellsHtml = '';
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const isOtherMonth = cellDate.getMonth() !== month;

    if (isOtherMonth) {
      cellsHtml += '<div class="pdf-calendar-day other-month"></div>';
      continue;
    }

    const key = calendarDateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const visits = window.__visitPlanning[key] || [];

    const visitsHtml = visits.map(function (v) {
      return '<div class="pdf-calendar-visit">' + escapeHtml(v.nom) + '</div>';
    }).join('');

    cellsHtml +=
      '<div class="pdf-calendar-day">' +
        '<div class="pdf-calendar-day-num">' + cellDate.getDate() + '</div>' +
        visitsHtml +
      '</div>';
  }

  return (
    '<div class="pdf-header">' +
      '<h1>🗓️ Planning des visites</h1>' +
      '<div class="pdf-header-sub">' + CALENDAR_MONTHS[month] + ' ' + year + '</div>' +
    '</div>' +
    '<div class="pdf-calendar-weekdays">' + CALENDAR_WEEKDAYS.map(function (w) { return '<div class="pdf-calendar-weekday">' + w + '</div>'; }).join('') + '</div>' +
    '<div class="pdf-calendar-grid">' + cellsHtml + '</div>' +
    '<div class="pdf-footer">Carte interactive développée par l\'agence d\'Angers du Cerema</div>'
  );
}

// Déclenche l'export PDF du mois actuellement affiché dans le calendrier.
window.__exportCalendarPDF = function () {
  try {
    const viewDate = window.__calendarViewDate;
    if (!viewDate) {
      console.warn('Export PDF planning : aucun mois affiché (window.__calendarViewDate manquant).');
      showCoordToast('⚠️ Ouvrez le calendrier avant d\'exporter');
      return;
    }

    const container = document.getElementById('pdf-export-container');
    if (!container) {
      console.error('Export PDF planning : #pdf-export-container introuvable dans le DOM.');
      showCoordToast('⚠️ Erreur : conteneur d\'export introuvable');
      return;
    }

    const html = buildCalendarPrintHtml(viewDate.getFullYear(), viewDate.getMonth());
    container.innerHTML = html;
    console.log('Export PDF planning : contenu généré (' + html.length + ' caractères) pour ' + CALENDAR_MONTHS[viewDate.getMonth()] + ' ' + viewDate.getFullYear() + '.');

    window.print();
  } catch (err) {
    console.error('Erreur lors de l\'export PDF du planning :', err);
    showCoordToast('⚠️ Échec de l\'export PDF (voir la console)');
  }
};

// ---- Boîte de dialogue "Ajouter une visite" : menu déroulant + zone de recherche texte ----

window.__calendarAddDate = null;
window.__calendarAddOptions = [];

window.__openCalendarAddDialog = function (dateKey) {
  window.__calendarAddDate = dateKey;

  // Liste des ouvrages disponibles (issues des données Grist déjà chargées sur la carte),
  // dédupliquée par nom (insensible à la casse/espaces) pour qu'un ouvrage n'apparaisse qu'une seule fois,
  // puis triée par nom
  const seenNames = new Set();
  window.__calendarAddOptions = (window.__structureRegistry || [])
    .filter(function (e) { return e.nom; })
    .filter(function (e) {
      const key = normalizeForSearch(e.nom);
      if (seenNames.has(key)) return false;
      seenNames.add(key);
      return true;
    })
    .map(function (e) { return { rowId: e.rowId, nom: e.nom }; })
    .sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

  const parts = dateKey.split('-');
  const dateObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const dateLabel = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const overlay = document.createElement('div');
  overlay.className = 'photo-modal-overlay calendar-add-overlay';
  overlay.id = 'calendar-add-overlay';
  overlay.onclick = function (e) { if (e.target === overlay) window.closeCalendarAddDialog(); };
  overlay.innerHTML =
    '<div class="photo-modal calendar-add-modal">' +
      '<button class="close-btn" onclick="window.closeCalendarAddDialog()">&times;</button>' +
      '<h3>Ajouter une visite</h3>' +
      '<div class="calendar-add-date">' + escapeHtml(dateLabel) + '</div>' +
      '<input type="text" id="calendar-add-search" class="calendar-add-search" placeholder="Rechercher un ouvrage..." autocomplete="off" oninput="window.__filterCalendarAddOptions(this.value)" />' +
      '<select id="calendar-add-select" class="calendar-add-select" size="8"></select>' +
      '<div class="calendar-add-empty" id="calendar-add-empty" style="display:none;">Aucun ouvrage trouvé pour cette recherche. Cliquez sur "Ajouter" pour enregistrer tout de même le nom saisi.</div>' +
      '<div class="calendar-add-actions">' +
        '<button class="btn btn-form" onclick="window.__confirmAddVisit()">Ajouter</button>' +
        '<button class="btn btn-maps" onclick="window.closeCalendarAddDialog()">Annuler</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  window.__filterCalendarAddOptions('');
  const searchInput = document.getElementById('calendar-add-search');
  if (searchInput) searchInput.focus();
};

window.__filterCalendarAddOptions = function (query) {
  const q = normalizeForSearch(query);
  const select = document.getElementById('calendar-add-select');
  const emptyBox = document.getElementById('calendar-add-empty');
  if (!select) return;
  const filtered = window.__calendarAddOptions.filter(function (o) { return !q || normalizeForSearch(o.nom).includes(q); });
  select.innerHTML = filtered.map(function (o) {
    return '<option value="' + (o.rowId != null ? o.rowId : '') + '">' + escapeHtml(o.nom) + '</option>';
  }).join('');
  if (emptyBox) emptyBox.style.display = filtered.length === 0 ? 'block' : 'none';
  if (filtered.length > 0) select.selectedIndex = 0;
};

window.closeCalendarAddDialog = function () {
  const el = document.getElementById('calendar-add-overlay');
  if (el) el.remove();
};

window.__confirmAddVisit = function () {
  const select = document.getElementById('calendar-add-select');
  const searchInput = document.getElementById('calendar-add-search');
  const dateKey = window.__calendarAddDate;
  if (!dateKey) return;

  let entry = null;
  if (select && select.selectedOptions && select.selectedOptions.length > 0 && select.value !== '') {
    const opt = select.selectedOptions[0];
    entry = { rowId: opt.value ? Number(opt.value) : null, nom: opt.textContent };
  } else if (searchInput && searchInput.value.trim() !== '') {
    // Aucun ouvrage correspondante dans la liste : le nom tapé est enregistré tel quel
    entry = { rowId: null, nom: searchInput.value.trim() };
  }
  if (!entry) { window.closeCalendarAddDialog(); return; }

  if (!window.__visitPlanning[dateKey]) window.__visitPlanning[dateKey] = [];
  window.__visitPlanning[dateKey].push(entry);
  saveVisitPlanning(true);
  if (entry.rowId != null) syncOuvrageCalendarColumn(entry.rowId);

  window.closeCalendarAddDialog();
  renderCalendarMonth();
};

window.__removeVisit = function (dateKey, idx) {
  if (!window.__visitPlanning[dateKey]) return;
  const removedEntry = window.__visitPlanning[dateKey][idx];
  window.__visitPlanning[dateKey].splice(idx, 1);
  if (window.__visitPlanning[dateKey].length === 0) delete window.__visitPlanning[dateKey];
  saveVisitPlanning(true);
  if (removedEntry && removedEntry.rowId != null) syncOuvrageCalendarColumn(removedEntry.rowId);
  renderCalendarMonth();
};

window.__calendarGoToVisit = function (dateKey, idx) {
  const visits = window.__visitPlanning[dateKey] || [];
  const visit = visits[idx];
  if (!visit || visit.rowId == null) return;
  const entry = (window.__structureRegistry || []).find(function (e) { return e.rowId === visit.rowId; });
  if (entry && entry.marker) {
    window.closeCalendarModal();
    const latlng = entry.marker.getLatLng();
    map.setView(latlng, Math.max(map.getZoom(), 16));
    entry.marker.openPopup();
  }
};

// Attache un popup qui s'ouvre au survol et reste ouvert tant que la souris
// est sur la couche (marqueur ou polygone) OU sur l'encadré lui-même (pour pouvoir cliquer les boutons)
function attachHoverCard(layer, contentHtml, extraOptions) {
  layer.bindPopup(contentHtml, Object.assign({
    closeButton: true,
    autoClose: false,
    closeOnClick: false,
    className: 'structure-popup'
  }, extraOptions || {}));

  let closeTimer = null;
  const cancelClose = () => { if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; } };
  const scheduleClose = () => { closeTimer = setTimeout(() => layer.closePopup(), 1000); };

  // Événements Leaflet (fonctionnent dans la plupart des cas)
  layer.on('mouseover', () => { cancelClose(); layer.openPopup(); });
  layer.on('mouseout', scheduleClose);

  // Renfort : écouteurs DOM natifs directement sur l'élément, plus fiables
  // avec certaines icônes personnalisées (image/SVG) selon les navigateurs
  layer.on('add', () => {
    const el = layer.getElement ? layer.getElement() : null;
    if (el) {
      el.addEventListener('mouseenter', () => { cancelClose(); layer.openPopup(); });
      el.addEventListener('mouseleave', scheduleClose);
    }
  });

  layer.on('popupopen', (e) => {
    const el = e.popup.getElement();
    if (el) {
      el.addEventListener('mouseenter', cancelClose);
      el.addEventListener('mouseleave', scheduleClose);
      // Filets de sécurité : tout mouvement ou clic dans l'encadré annule la fermeture programmée
      el.addEventListener('mousemove', cancelClose);
      el.addEventListener('mousedown', cancelClose);
      el.addEventListener('click', cancelClose);
    }
  });
}

// Crée l'icône d'un marqueur "Ouvrage" : soit une image fournie, soit un pin rouge par défaut
function createStructureIcon(imageUrl, color, attachmentId) {
  const url = imageUrl ? String(imageUrl).trim() : '';
  if (url !== '') {
    return L.icon({
      iconUrl: url,
      iconSize: [68, 68],      // taille x2 par rapport à avant (34 -> 68)
      iconAnchor: [34, 68],
      popupAnchor: [0, -68]
    });
  }

  // Pin SVG par défaut (rouge, ou couleur personnalisée si CouleurStructure est renseignée)
  const fill = color || '#e53935';
  const pinSvg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">' +
    '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" ' +
    'fill="' + fill + '" stroke="#00000055" stroke-width="1"/>' +
    '<circle cx="14" cy="14" r="6" fill="#fff"/>' +
    '</svg>';

  return L.divIcon({
    html: pinSvg,
    className: '', // évite le style par défaut de Leaflet (fond blanc carré)
    iconSize: [28, 40],
    iconAnchor: [14, 40],
    popupAnchor: [0, -40]
  });
}

// -------------------------------------------------------------------
// Panneau de recherche / filtre hiérarchique Domaine > Famille > Groupe
// -------------------------------------------------------------------

function normalizeForSearch(str) {
  return String(str || '').trim().toLowerCase();
}

// Affiche uniquement les ouvrages du registre qui satisfont le prédicat ; ajuste la vue
function applyStructureFilter(predicate) {
  structureLayerGroup.clearLayers();
  const matchedLatLngs = [];
  window.__structureRegistry.forEach(entry => {
    if (!entry.marker) return;
    if (predicate(entry)) {
      entry.marker.addTo(structureLayerGroup);
      matchedLatLngs.push(entry.marker.getLatLng());
      // clearLayers() peut recréer l'élément DOM de l'icône : on réapplique le clignotement au besoin
      const prevoirEntry = window.__travauxAPrevoir[entry.travauxPrevoirKey];
      setOuvrageBlink(entry.marker, !!(prevoirEntry && prevoirEntry.urgent));
    }
  });

  const noResultBox = document.getElementById('structure-no-result');
  if (noResultBox) noResultBox.style.display = matchedLatLngs.length === 0 ? 'block' : 'none';

  if (matchedLatLngs.length > 0) {
    map.fitBounds(matchedLatLngs, { padding: [40, 40], maxZoom: 16 });
  }
}

function resetStructureFilter() {
  applyStructureFilter(() => true);
}

// -------------------------------------------------------------------
// Mode visite : masque les domaines et n'affiche que les ouvrages
// dont une visite est programmée au jour choisi (calendrier)
// -------------------------------------------------------------------

let visitModeActive = false;
let visitModeDate = null; // aucun jour choisi par défaut : à l'utilisateur de le sélectionner

function toggleVisitMode() {
  visitModeActive = !visitModeActive;
  const btn = document.getElementById('map-visit-mode-btn');
  if (btn) btn.classList.toggle('active', visitModeActive);

  if (visitModeActive) {
    map.removeLayer(layerGroup); // masque les polygones de domaine
    ensureVisitModePanel();
    if (visitModeDate) {
      applyVisitModeFilter();
    } else {
      structureLayerGroup.clearLayers(); // rien à afficher tant qu'aucun jour n'est choisi
      window.showVisitModeDateModal();
    }
  } else {
    if (!map.hasLayer(layerGroup)) layerGroup.addTo(map); // réaffiche les domaines
    removeVisitModePanel();
    resetStructureFilter();
  }
}

function ensureVisitModePanel() {
  let panel = document.getElementById('visit-mode-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'visit-mode-panel';
    panel.className = 'visit-mode-panel';
    document.body.appendChild(panel);
  }
  updateVisitModePanelContent();
}

// (Re)construit le contenu du panneau : jour actuellement affiché, bouton pour le changer, compteur
function updateVisitModePanelContent() {
  const panel = document.getElementById('visit-mode-panel');
  if (!panel) return;
  const dateLabel = visitModeDate
    ? new Date(visitModeDate + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
    : 'Aucun jour sélectionné';
  panel.innerHTML =
    '<label class="visit-mode-label">✅ Mode visite</label>' +
    '<div class="visit-mode-current-date">' + escapeHtml(dateLabel) + '</div>' +

    '<div id="visit-mode-count" class="visit-mode-count"></div>';

function updateVisitModeCount() {
  const countEl = document.getElementById('visit-mode-count');
  if (!countEl) return;
  if (!visitModeDate) { countEl.textContent = ''; return; }
  const plannedForDay = window.__visitPlanning[visitModeDate] || [];
  countEl.textContent = plannedForDay.length > 0
    ? plannedForDay.length + ' visite(s) programmée(s) ce jour'
    : 'Aucune visite programmée ce jour';

function removeVisitModePanel() {
  const panel = document.getElementById('visit-mode-panel');
  if (panel) panel.remove();
}
