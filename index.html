// Valide le jour choisi dans la fenêtre, ferme la fenêtre et met à jour la carte + le panneau
window.__confirmVisitModeDate = function () {
  const input = document.getElementById('visit-mode-date-modal-input');
  if (!input || !input.value) return;
  visitModeDate = input.value;
  window.closePhotoModal();
  updateVisitModePanelContent();
  applyVisitModeFilter();
};

// Filtre la carte pour ne garder que les ouvrages ayant une visite programmée à visitModeDate
function applyVisitModeFilter() {
  if (!visitModeDate) return;

  const plannedForDay = window.__visitPlanning[visitModeDate] || [];
  const rowIds = new Set(plannedForDay.map(v => v.rowId));

  structureLayerGroup.clearLayers();
  const matchedLatLngs = [];
  window.__structureRegistry.forEach(entry => {
    if (!entry.marker) return;
    if (rowIds.has(entry.rowId)) {
      entry.marker.addTo(structureLayerGroup);
      matchedLatLngs.push(entry.marker.getLatLng());
    }
  });

  if (matchedLatLngs.length > 0) {
    map.fitBounds(matchedLatLngs, { padding: [40, 40], maxZoom: 16 });
  }

  updateVisitModeCount();
}

window.__resetStructureSearch = function () {
  const input = document.getElementById('structure-search-input');
  if (input) input.value = '';
  resetStructureFilter();
};

window.__onStructureSearchInput = function (value) {
  const q = normalizeForSearch(value);
  if (!q) { resetStructureFilter(); return; }
  applyStructureFilter(entry => normalizeForSearch(entry.nom).includes(q));
};

// Va directement à l\'ouvrage sur la carte (zoom + ouverture de son encadré)
window.__goToStructure = function (idx) {
  const entry = window.__structureRegistry[idx];
  if (!entry || !entry.marker) return;
  const latlng = entry.marker.getLatLng();
  map.setView(latlng, Math.max(map.getZoom(), 16));
  entry.marker.openPopup();
};

// Ouvre/ferme un nœud de l'arbre (domaine, famille ou groupe)
window.__toggleTreeNode = function (arrowEl) {
  const row = arrowEl.parentElement;
  const childrenDiv = row.nextElementSibling;
  if (childrenDiv && childrenDiv.classList.contains('tree-children')) {
    const opening = !childrenDiv.classList.contains('open');
    childrenDiv.classList.toggle('open', opening);
    arrowEl.textContent = opening ? '▾' : '▸';
  }
};

// Ouvre/ferme le panneau complet de l'arbre (flèche à côté du champ de recherche)
window.__toggleTreePanel = function () {
  const treeDiv = document.getElementById('structure-tree');
  if (treeDiv) treeDiv.classList.toggle('open');
};

// (Re)construit le panneau de recherche : arbre en cascade Domaine > Famille > Groupe > Ouvrage(s)
function buildSearchPanel() {
  let panel = document.getElementById('structure-search-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'structure-search-panel';
    panel.className = 'structure-search-panel';
    document.body.appendChild(panel);
  }

  // domaineTree : Map(domaine -> Map(famille -> Map(groupe -> [indices dans __structureRegistry])))
  // rootFamilies : idem mais pour les familles SANS domaine renseigné (affichées à la racine)
  const domaineTree = new Map();
  const rootFamilies = new Map();

  // Ajoute une combinaison domaine/famille/groupe (avec ou sans ouvrage associé) dans l'arbre
  function addToTree(domaine, famille, groupe, structureIdx) {
    const f = famille && famille.trim() ? famille.trim() : 'Non renseigné';
    const g = groupe && groupe.trim() ? groupe.trim() : 'Non renseigné';
    const d = domaine && domaine.trim() ? domaine.trim() : '';

    let groupeMap;
    if (d) {
      if (!domaineTree.has(d)) domaineTree.set(d, new Map());
      if (!domaineTree.get(d).has(f)) domaineTree.get(d).set(f, new Map());
      groupeMap = domaineTree.get(d).get(f);
    } else {
      if (!rootFamilies.has(f)) rootFamilies.set(f, new Map());
      groupeMap = rootFamilies.get(f);
    }

    if (!groupeMap.has(g)) groupeMap.set(g, []);
    if (structureIdx !== null && structureIdx !== undefined) groupeMap.get(g).push(structureIdx);
  }

  window.__structureRegistry.forEach((entry, idx) => {
    // entry.domaine est un tableau (une Famille peut appartenir à plusieurs Domaines) :
    // l\'ouvrage doit apparaître sous chacun d'eux, ou à la racine si aucun domaine trouvé.
    const domainesEntry = Array.isArray(entry.domaine) ? entry.domaine : (entry.domaine ? [entry.domaine] : []);
    if (domainesEntry.length === 0) {
      addToTree('', entry.famille, entry.groupe, idx);
    } else {
      domainesEntry.forEach(d => addToTree(d, entry.famille, entry.groupe, idx));
    }
  });
  // Ajoute aussi les combinaisons sans ouvrage associé (ex : base Famille/Groupe séparée)
  (window.__allClassifPairs || []).forEach(pair => {
    addToTree(pair.domaine, pair.famille, pair.groupe, null);
  });

  function renderStructureLeaf(idx) {
    const entry = window.__structureRegistry[idx];
    return '<div class="tree-row tree-structure" onclick="window.__goToStructure(' + idx + ')">' +
      '<span class="tree-arrow"></span><span class="tree-label">📍 ' + escapeHtml(entry.nom || 'Ouvrage') + '</span>' +
    '</div>';
  }

  function renderGroupe(groupe, idxList) {
    // Déduplique par nom normalisé : une même ouvrage ne doit apparaître qu'une fois,
    // peu importe le nombre de visites (lignes) qui lui sont associées.
    const seenNames = new Set();
    const dedupedIdxList = idxList.filter(idx => {
      const entry = window.__structureRegistry[idx];
      const key = normalizeForSearch(entry ? entry.nom : '');
      if (seenNames.has(key)) return false;
      seenNames.add(key);
      return true;
    });

    const structuresHtml = dedupedIdxList.length > 0
      ? dedupedIdxList.map(renderStructureLeaf).join('')
      : '<div class="tree-empty-msg">Aucun ouvrage n\'est associé aux paramètres sélectionnés.</div>';
    return (
      '<div class="tree-groupe">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(groupe) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + structuresHtml + '</div>' +
      '</div>'
    );
  }

  function renderFamille(famille, groupeMap) {
    const groupesHtml = Array.from(groupeMap.keys()).sort().map(g => renderGroupe(g, groupeMap.get(g))).join('');
    return (
      '<div class="tree-famille">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(famille) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + groupesHtml + '</div>' +
      '</div>'
    );
  }

  const domainesHtml = Array.from(domaineTree.keys()).sort().map(domaine => {
    const famMap = domaineTree.get(domaine);
    const familiesHtml = Array.from(famMap.keys()).sort()
      .map(f => renderFamille(f, famMap.get(f))).join('');
    return (
      '<div class="tree-domaine">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(domaine) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + familiesHtml + '</div>' +
      '</div>'
    );
  }).join('');

  // Les familles sans domaine renseigné apparaissent directement à la racine (pas de niveau Domaine)
  const rootFamiliesHtml = Array.from(rootFamilies.keys()).sort()
    .map(f => renderFamille(f, rootFamilies.get(f))).join('');

  const treeHtml = domainesHtml + rootFamiliesHtml;

  panel.innerHTML =
    '<div class="structure-search-row">' +
      '<input type="text" id="structure-search-input" placeholder="Rechercher une ou des ouvrages" oninput="window.__onStructureSearchInput(this.value)" />' +
      '<button class="structure-search-toggle" onclick="window.__toggleTreePanel()">▾</button>' +
    '</div>' +
    '<div class="structure-tree" id="structure-tree">' + treeHtml + '</div>' +
    '<div id="structure-no-result" class="structure-no-result">Aucun ouvrage n\'est associé aux paramètres sélectionnés.</div>' +
    '<div class="structure-search-reset" onclick="window.__resetStructureSearch()">Afficher tous les ouvrages</div>';
}

async function drawRecords(records, mappings) {
  layerGroup.clearLayers();
  structureLayerGroup.clearLayers();
  window.__structureRegistry = [];
  const bounds = [];

  let tokenInfo = null;
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
  }

  // Grilles d'évaluation : communes à tous les ouvrages, lues une seule fois depuis la 1ère ligne du tableau
  const grilleEvalGlobalId = 'grille-eval-global';
  if (records.length > 0) {
    const firstMapped = grist.mapColumnNames(records[0]) || records[0];
    window.__photoStore[grilleEvalGlobalId] = [
      { url: firstMapped.GrilleEval1Structure || '', desc: firstMapped.DescriptionGrilleEval1Structure || '' },
      { url: firstMapped.GrilleEval2Structure || '', desc: firstMapped.DescriptionGrilleEval2Structure || '' }
    ];
  }

  // Liste des polygones de domaine (remplie pendant leur traitement ci-dessous), utilisée ensuite
  // pour détecter automatiquement dans quel domaine se trouve chaque ouvrage
  const domainePolygonsGlobal = [];

  // Recense TOUTES les combinaisons Domaine/Famille/Groupe de la liste de référence (colonnes dédiées,
  // séparées des colonnes Famille/Groupe des ouvrages). Reliées entre elles par ligne (champ rapporté),
  // ce qui est légitime ici puisque c'est justement la "base" Famille/Groupe/Domaine.
  // Une famille peut appartenir à jusqu'à 5 domaines (5 colonnes) : elle apparaîtra sous chacun d'eux.
  window.__allClassifPairs = [];
  records.forEach(record => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const f = formatTextValue(mapped.FamilleRefListe).trim();
      const g = formatTextValue(mapped.GroupeRefListe).trim();
      const domaines = [
        formatTextValue(mapped.DomaineRefListe1).trim(),
        formatTextValue(mapped.DomaineRefListe2).trim(),
        formatTextValue(mapped.DomaineRefListe3).trim(),
        formatTextValue(mapped.DomaineRefListe4).trim(),
        formatTextValue(mapped.DomaineRefListe5).trim()
      ].filter(d => d !== '');

      if (domaines.length > 0) {
        domaines.forEach(d => window.__allClassifPairs.push({ domaine: d, famille: f, groupe: g }));
      } else if (f || g) {
        // Aucun domaine renseigné : la famille apparaîtra directement à la racine de l'arbre
        window.__allClassifPairs.push({ domaine: '', famille: f, groupe: g });
      }
    } catch (err) {
      // ignore silencieusement une ligne mal formée pour cette collecte annexe
    }
  });

  // Table de correspondance Famille -> Domaine(s), construite à partir du bloc de référence
  // (FamilleRefListe / DomaineRefListe1-5, placés côte à côte sur les mêmes lignes de ce bloc).
  // Sert à retrouver le(s) domaine(s) d'un ouvrage via sa Famille (colonne "ouvrage" à gauche),
  // SANS jamais relier ce bloc de référence (à droite) à un ouvrage par simple position de ligne
  // (les colonnes grisées "-" séparent volontairement les deux blocs dans le tableau Grist).
  // Une Famille peut appartenir à plusieurs Domaines : l\'ouvrage apparaîtra alors sous chacun d'eux.
  window.__familleToDomaines = new Map();
  (window.__allClassifPairs || []).forEach(pair => {
    const fKey = pair.famille.trim().toLowerCase();
    if (!fKey || !pair.domaine) return;
    if (!window.__familleToDomaines.has(fKey)) window.__familleToDomaines.set(fKey, new Set());
    window.__familleToDomaines.get(fKey).add(pair.domaine);
  });
  function getDomainesForFamille(famille) {
    const fKey = (famille || '').toString().trim().toLowerCase();
    if (!fKey || !window.__familleToDomaines.has(fKey)) return [];
    return Array.from(window.__familleToDomaines.get(fKey));
  }

  // Recense la liste EXHAUSTIVE des Familles et des Groupes depuis les colonnes de référence dédiées
  // (indépendantes des ouvrages), pour que le menu déroulant propose absolument tout.
  window.__allFamilleNames = new Set();
  window.__allGroupeNames = new Set();
  records.forEach(record => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const f = formatTextValue(mapped.ListeToutesFamilles).trim();
      const g = formatTextValue(mapped.ListeTousGroupes).trim();
      if (f) window.__allFamilleNames.add(f);
      if (g) window.__allGroupeNames.add(g);
    } catch (err) {
      // ignore silencieusement
    }
  });

  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      // ------------------ Groupe "Domaine / Parc" (polygone) ------------------
      const wkt = mapped.PolygoneWKT;
      if (wkt && String(wkt).trim() !== '') {
        const polygons = parseWKT(wkt);
        domainePolygonsGlobal.push({ name: mapped.NomDomaine || 'Domaine', polygons: polygons });
        const color = mapped.CouleurDomaine || classifyMilieuColor(mapped.MilieuDomaine) || '#2e7d32'; // vert par défaut
        const nomDomaine = mapped.NomDomaine || 'Domaine';
        const superficie = mapped.SuperficieDomaine || '—';
        const protection = mapped.ProtectionDomaine || '—';

        const photoDomaineId = 'photo-domaine-' + Math.random().toString(36).slice(2);
        window.__photoStore[photoDomaineId] = [
          { url: mapped.PhotoDomaine || '', desc: mapped.DescriptionPhotoDomaine || '' }
        ];

        const domaineCardHtml =
          '<div class="structure-card">' +
            '<h3>' + escapeHtml(nomDomaine) + '</h3>' +
            '<div class="row"><b>Est. Superficie (ha) :</b> ' + escapeHtml(superficie) + '</div>' +
            '<div class="row"><b>Protection(s) :</b> ' + escapeHtml(protection) + '</div>' +
            '<div class="buttons">' +
              '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + photoDomaineId + '\', ' + jsStringLiteral(nomDomaine) + ');">📷 Photo</a>' +
            '</div>' +
          '</div>';

        polygons.forEach(rings => {
          const poly = L.polygon(rings, {
            color: color,
            fillColor: color,
            fillOpacity: 0.35,
            weight: 2
          }).addTo(layerGroup);

          poly.on('mouseover', function () { this.setStyle({ weight: 3, fillOpacity: 0.55 }); });
          poly.on('mouseout', function () { this.setStyle({ weight: 2, fillOpacity: 0.35 }); });

          attachHoverCard(poly, domaineCardHtml, { closeButton: false });

          rings.forEach(ring => ring.forEach(pt => bounds.push(pt)));
        });
      }
    } catch (err) {
      // Une erreur sur cette ligne ne doit jamais empêcher l'affichage des autres
      console.error('Erreur (domaine) lors du traitement de la ligne ' + index + ' :', err, record);
    }
  });

  // ------------------ Groupe "Ouvrage" (point) : regroupement par nom / coordonnées ------------------
  // Plusieurs lignes peuvent partager le même nom et/ou les mêmes coordonnées GPS (ex : l\'ouvrage
  // est décrite une fois, mais peut aussi apparaître sur plusieurs lignes).
  const structureGroups = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const key = structureGroupKey(mapped);
      if (!key) return; // ni nom, ni coordonnées exploitables sur cette ligne
      if (!structureGroups.has(key)) structureGroups.set(key, []);
      structureGroups.get(key).push({ mapped, rowId: record.id });
    } catch (err) {
      console.error('Erreur (regroupement ouvrage) ligne ' + index + ' :', err, record);
    }
  });

  // Table de correspondance : nom d\'ouvrage normalisé -> clé de groupe (pour relier les visites par nom)
  const nameToGroupKey = new Map();
  structureGroups.forEach((entries, key) => {
    entries.forEach(e => {
      const name = (e.mapped.NomStructure || '').toString().trim().toLowerCase();
      if (name && !nameToGroupKey.has(name)) nameToGroupKey.set(name, key);
    });
  });

  // ------------------ Visites : collectées sur TOUTES les lignes, reliées par nom (pas par position de ligne) ------------------
  // Une visite est reliée à sa ouvrage via le champ "Nom complet ouvrage" qui doit correspondre
  // (au nom près, insensible à la casse/espaces) au champ "Nom" de l\'ouvrage.
  const visitsByGroupKey = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      const ficheInspecteurs = formatTextValue(mapped.InspecteursFiche);
      const ficheDate = mapped.DateVisiteFiche || '';
      const ficheNomComplet = mapped.NomCompletStructureFiche || '';
      const ficheDescription = mapped.DescriptionFiche || '';
      const ficheConditionVisite = mapped.ConditionVisiteFiche || '';
      const ficheDesordreMecanique = mapped.DesordreMecaniqueFiche || '';
      const ficheDesordreUsage = mapped.DesordreUsageFiche || '';
      const ficheClignoteRouge = !!mapped.ClignoteRougeFiche;
      const fichePhotos = [
        { url: mapped.PhotoFiche1 || '', desc: mapped.DescriptionPhotoFiche1 || '' },
        { url: mapped.PhotoFiche2 || '', desc: mapped.DescriptionPhotoFiche2 || '' },
        { url: mapped.PhotoFiche3 || '', desc: mapped.DescriptionPhotoFiche3 || '' },
        { url: mapped.PhotoFiche4 || '', desc: mapped.DescriptionPhotoFiche4 || '' },
        { url: mapped.PhotoFiche5 || '', desc: mapped.DescriptionPhotoFiche5 || '' }
      ];
      const fichePhotoPresente = fichePhotos.some(p => Array.isArray(p.url) ? p.url.length > 0 : !!p.url);
      const ficheExiste = !!(ficheInspecteurs || ficheDate || ficheNomComplet || ficheDescription ||
        ficheConditionVisite || ficheDesordreMecanique ||
        ficheDesordreUsage || ficheClignoteRouge || fichePhotoPresente);
      if (!ficheExiste) return; // cette ligne ne contient aucune donnée de visite

      const normalizedName = ficheNomComplet.toString().trim().toLowerCase();
      if (!normalizedName) {
        console.warn('Visite ligne ' + index + ' ignorée : le champ "Nom complet ouvrage" est vide, impossible de la relier à un ouvrage.', record);
        return;
      }
      const matchedKey = nameToGroupKey.get(normalizedName);
      if (!matchedKey) {
        console.warn('Visite ligne ' + index + ' ignorée : aucun ouvrage ne correspond au nom "' + ficheNomComplet + '".', record);
        return;
      }

      if (!visitsByGroupKey.has(matchedKey)) visitsByGroupKey.set(matchedKey, []);
      visitsByGroupKey.get(matchedKey).push({
        parsedDate: parseVisitDate(ficheDate),
        label: formatVisitLabel(ficheDate),
        data: {
          inspecteurs: ficheInspecteurs,
          date: ficheDate,
          nomComplet: ficheNomComplet,
          description: ficheDescription,
          conditionVisite: ficheConditionVisite,
          desordreMecanique: ficheDesordreMecanique,
          desordreUsage: ficheDesordreUsage,
          clignoteRouge: ficheClignoteRouge,
          photos: fichePhotos
        }
      });
    } catch (err) {
      console.error('Erreur (collecte visite) ligne ' + index + ' :', err, record);
    }
  });

  // ------------------ Travaux / interventions : reliés par nom, comme les visites ------------------
  const travauxByGroupKey = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      const travailDate = mapped.DateTravail || '';
      const travailMecaniqueUsage = formatTextValue(mapped.MecaniqueUsageTravail);
      const travailTypeAction = formatTextValue(mapped.TypeActionTravail);
      const travailCommentaire = mapped.CommentaireTravail || '';
      const travailNomOuvrage = mapped.NomOuvrageTravail || '';

      const travailExiste = !!(travailDate || travailMecaniqueUsage || travailTypeAction || travailCommentaire);
      if (!travailExiste) return;

      const normalizedName = travailNomOuvrage.toString().trim().toLowerCase();
      if (!normalizedName) {
        console.warn('Travaux ligne ' + index + ' ignoré : le champ "Nom ouvrage" est vide, impossible de le relier.', record);
        return;
      }
      const matchedKey = nameToGroupKey.get(normalizedName);
      if (!matchedKey) {
        console.warn('Travaux ligne ' + index + ' ignoré : aucun ouvrage ne correspond au nom "' + travailNomOuvrage + '".', record);
        return;
      }

      if (!travauxByGroupKey.has(matchedKey)) travauxByGroupKey.set(matchedKey, []);
      travauxByGroupKey.get(matchedKey).push({
        parsedDate: parseVisitDate(travailDate),
        date: travailDate,
        mecaniqueUsage: travailMecaniqueUsage,
        typeAction: travailTypeAction,
        commentaire: travailCommentaire
      });
    } catch (err) {
      console.error('Erreur (collecte travaux) ligne ' + index + ' :', err, record);
    }
  });

  // ------------------ Objets (fiches détaillées) : reliés par nom d'ouvrage, comme les travaux/visites ------------------
  // Contrairement au groupe "Objet1..6" (limité à 6, avec liens externes), ce groupe permet un nombre
  // illimité d'objets par ouvrage, chacun sur sa propre ligne, avec photo + utilité affichées dans une fiche interne.
  const objetsDetailByGroupKey = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      const objetNom = formatTextValue(mapped.NomObjet).trim();
      const objetNomOuvrage = mapped.NomOuvrageObjet || '';

      if (!objetNom) return; // ligne sans objet renseigné : on ignore

      const normalizedName = objetNomOuvrage.toString().trim().toLowerCase();
      if (!normalizedName) {
        console.warn('Objet ligne ' + index + ' ignoré : le champ "Nom ouvrage" est vide, impossible de le relier.', record);
        return;
      }
      const matchedKey = nameToGroupKey.get(normalizedName);
      if (!matchedKey) {
        console.warn('Objet ligne ' + index + ' ignoré : aucun ouvrage ne correspond au nom "' + objetNomOuvrage + '".', record);
        return;
      }

      if (!objetsDetailByGroupKey.has(matchedKey)) objetsDetailByGroupKey.set(matchedKey, []);
      objetsDetailByGroupKey.get(matchedKey).push({
        nom: objetNom,
        type: formatTextValue(mapped.TypeObjetDetail),
        photo: mapped.PhotoObjet || '',
        utilite: mapped.UtiliteObjet || ''
      });
    } catch (err) {
      console.error('Erreur (collecte objet) ligne ' + index + ' :', err, record);
    }
  });

  structureGroups.forEach((entries, key) => {
    try {
      // Choisit l'entrée "principale" : la première du groupe qui a des coordonnées valides
      let primary = null;
      for (const e of entries) {
        const la = parseFrenchNumber(e.mapped.Latitude);
        const lo = parseFrenchNumber(e.mapped.Longitude);
        if (Number.isFinite(la) && Number.isFinite(lo) && !(la === 0 && lo === 0)) {
          primary = { mapped: e.mapped, rowId: e.rowId, lat: la, lng: lo };
          break;
        }
      }
      if (!primary) return; // aucune coordonnée valide dans tout le groupe

      const mapped = primary.mapped;
      const rowId = primary.rowId;
      const lat = primary.lat;
      const lng = primary.lng;

      const color = mapped.CouleurStructure || null; // null -> rouge par défaut dans createStructureIcon
      const nom = mapped.NomStructure || 'Ouvrage';
      const imageSrc = resolveImageValue(mapped.ImageStructure, tokenInfo);
      const imageAttachmentId = extractAttachmentId(mapped.ImageStructure);
      // Clé normalisée utilisée pour relier cet ouvrage à sa note "Travaux à prévoir" (même logique que les travaux/visites, reliés par nom)
      const travauxPrevoirKey = nom.toString().trim().toLowerCase();

      // Domaine(s) de cet ouvrage : retrouvé(s) via sa Famille dans le bloc de référence
      // (une Famille peut appartenir à plusieurs Domaines), jamais lu directement sur cette ligne.
      const familleStructureNom = formatTextValue(mapped.FamilleStructure);
      const domainesStructure = getDomainesForFamille(familleStructureNom);

      // Enregistre cet ouvrage dans le registre global (utilisé par le panneau de recherche)
      window.__structureRegistry.push({
        marker: null, // renseigné juste après la création du marqueur
        rowId: rowId, // identifiant de la ligne Grist "principale" de cet ouvrage (utilisé par le calendrier)
        nom: nom,
        domaine: domainesStructure, // tableau : une Famille peut appartenir à plusieurs Domaines
        famille: familleStructureNom,
        groupe: formatTextValue(mapped.GroupeStructure),
        travauxPrevoirKey: travauxPrevoirKey
      });
      const registryEntry = window.__structureRegistry[window.__structureRegistry.length - 1];

      // Visites reliées à cet ouvrage par nom (collectées indépendamment de la position de ligne),
      // triées de la plus récente à la plus ancienne (calculées ICI, avant la création du marqueur,
      // car le clignotement du pin dépend désormais de la case cochée sur la visite la plus récente).
      const visits = visitsByGroupKey.get(key) || [];
      visits.sort((a, b) => {
        if (a.parsedDate && b.parsedDate) return b.parsedDate - a.parsedDate;
        if (a.parsedDate) return -1;
        if (b.parsedDate) return 1;
        return 0;
      });
      // Le pin clignote en rouge si la visite la plus récente a la case "Clignote en rouge" cochée.
      // Lu directement depuis les données de la table à chaque rafraîchissement : aucune écriture
      // séparée n'est nécessaire, donc pas de risque de désynchronisation.
      const clignoteRouge = visits.length > 0 && !!visits[0].data.clignoteRouge;

      const marker = L.marker([lat, lng], {
        icon: createStructureIcon(imageSrc, color, imageAttachmentId)
      }).addTo(structureLayerGroup);
      registryEntry.marker = marker;
      setOuvrageBlink(marker, clignoteRouge);

      const domaineAuto = findDomaineForPoint(lat, lng, domainePolygonsGlobal);
      const domaineGeo = domaineAuto || mapped.DomaineStructure || '—';
      const classifDomaine = domainesStructure.length > 0 ? domainesStructure.join(', ') : '—';
      const classifFamille = familleStructureNom || '—';
      const classifGroupe = formatTextValue(mapped.GroupeStructure) || '—';
      const lienFiche = mapped.LienFicheStructure || '';
      const lienFormulaire = mapped.LienFormulaireStructure || '';

      // Bouton "Voir la/les fiche(s)" : libellé au singulier ou pluriel selon le nombre de visites
      const warningId = 'warn-' + Math.random().toString(36).slice(2);
      const labelBouton = visits.length > 1 ? '📄 Voir les fiches visites' : '📄 Voir la fiche visite';
      let btnFiche, warningBox;

      if (lienFiche) {
        btnFiche = '<a class="btn btn-fiche" href="' + escapeHtml(lienFiche) + '" target="_blank" rel="noopener">' + labelBouton + '</a>';
        warningBox = '';
      } else if (visits.length > 0) {
        const ficheGroupId = 'fiche-group-' + Math.random().toString(36).slice(2);
        window.__ficheStore[ficheGroupId] = { visits: visits };
        btnFiche = '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showFicheModal(\'' + ficheGroupId + '\');">' + labelBouton + '</a>';
        warningBox = '';
      } else {
        btnFiche = '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); document.getElementById(\'' + warningId + '\').classList.add(\'visible\');">' + labelBouton + '</a>';
        warningBox = '<div class="warning-box" id="' + warningId + '">Il n\'existe aucune fiche liée à cet ouvrage, veuillez en créer une pour accéder à ce paramètre.</div>';
      }

      // Stockage des 4 emplacements photo "initiale" de l'ouvrage.
      // Important : on ne se limite pas à l'entrée "primary" (celle qui porte les coordonnées) car,
      // selon la façon dont la table est remplie, les photos peuvent avoir été saisies sur une AUTRE
      // ligne du même groupe (même nom d'ouvrage). On cherche donc, pour chaque emplacement 1 à 4,
      // la première ligne du groupe qui a réellement une valeur non vide.
      function firstNonEmptyInGroup(fieldName) {
        for (const e of entries) {
          const v = e.mapped[fieldName];
          const hasValue = Array.isArray(v) ? v.length > 0 : !!v;
          if (hasValue) return v;
        }
        return '';
      }
      const photoStructureId = 'photo-structure-' + Math.random().toString(36).slice(2);
      window.__photoStore[photoStructureId] = [
        { url: firstNonEmptyInGroup('Photo1Structure'), desc: firstNonEmptyInGroup('DescriptionPhoto1Structure') },
        { url: firstNonEmptyInGroup('Photo2Structure'), desc: firstNonEmptyInGroup('DescriptionPhoto2Structure') },
        { url: firstNonEmptyInGroup('Photo3Structure'), desc: firstNonEmptyInGroup('DescriptionPhoto3Structure') },
        { url: firstNonEmptyInGroup('Photo4Structure'), desc: firstNonEmptyInGroup('DescriptionPhoto4Structure') }
      ];

      // Stockage des travaux (interventions) reliés à cet ouvrage, triés du plus récent au plus ancien
      const travaux = (travauxByGroupKey.get(key) || []).slice().sort((a, b) => {
        if (a.parsedDate && b.parsedDate) return b.parsedDate - a.parsedDate;
        if (a.parsedDate) return -1;
        if (b.parsedDate) return 1;
        return 0;
      });
      const travauxId = 'travaux-' + Math.random().toString(36).slice(2);
      window.__travauxStore[travauxId] = travaux;

      // Stockage des objets liés à l'ouvrage (jusqu'à 6), pour le menu déroulant
      const objetUid = 'objet-' + Math.random().toString(36).slice(2);
      const objetsListe = [1, 2, 3, 4, 5, 6].map(n => ({
        nom: formatTextValue(mapped['Objet' + n + 'Nom']),
        type: formatTextValue(mapped['Objet' + n + 'Type']),
        note: formatTextValue(mapped['Objet' + n + 'NoteGenerale']),
        lienFiche: mapped['Objet' + n + 'LienFiche'] || '',
        lienCreer: mapped['Objet' + n + 'LienCreer'] || ''
      })).filter(o => o.nom);
      window.__objetsStore[objetUid] = objetsListe;

      // Note générale de l'ouvrage : calculée automatiquement (note la plus basse parmi les objets),
      // plus aucune saisie directe de "l'état de l'ouvrage" n'est possible.
      const noteGenerale = computeOuvrageNoteGenerale(objetsListe);
      registryEntry.etat = noteGenerale;

      const objetOptionsHtml = objetsListe.map(o =>
        '<option value="' + escapeHtml(o.nom) + '">' + escapeHtml(o.nom) + (o.type ? ' (' + escapeHtml(o.type) + ')' : '') + '</option>'
      ).join('');
      const objetSelectHtml = objetsListe.length > 0
        ? '<select class="objet-select" id="select-' + objetUid + '" onchange="window.__onObjetSelect(\'' + objetUid + '\', this.value)">' +
            '<option value="">— Sélectionner un objet —</option>' + objetOptionsHtml +
          '</select>'
        : '';

      // Fiches d'objets détaillées (nombre illimité, reliées par nom d'ouvrage) : nom + photo + utilité,
      // consultables via le bouton "🗂️ Voir les objets"
      const objetsDetail = objetsDetailByGroupKey.get(key) || [];
      const objetsDetailId = 'objets-detail-' + Math.random().toString(36).slice(2);
      window.__objetsDetailStore[objetsDetailId] = objetsDetail;
      const warnObjetsId = 'warn-objets-' + Math.random().toString(36).slice(2);
      const btnVoirObjets = objetsDetail.length > 0
        ? '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showObjetsListModal(\'' + objetsDetailId + '\', ' + jsStringLiteral(nom) + ');">🗂️ Voir les objets</a>'
        : '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); document.getElementById(\'' + warnObjetsId + '\').classList.add(\'visible\');">🗂️ Voir les objets</a>';
      const warningBoxObjets = objetsDetail.length > 0
        ? ''
        : '<div class="warning-box" id="' + warnObjetsId + '">Aucun objet n\'est renseigné pour cet ouvrage.</div>';

      const noteGeneraleHtml = gradeBadge(noteGenerale || '—');

      // Stocke les données nécessaires à la fiche PDF complète de l'ouvrage
      const ouvrageId = 'ouvrage-' + Math.random().toString(36).slice(2);
      window.__ouvrageStore[ouvrageId] = {
        nom: nom,
        rowId: rowId,
        lat: lat,
        lng: lng,
        domaineGeo: domaineGeo,
        classifDomaine: classifDomaine,
        classifFamille: classifFamille,
        classifGroupe: classifGroupe,
        description: mapped.DescriptionOuvrage || '',
        codeIdentification: mapped.CodeIdentificationOuvrage || '',
        indiceStrategique: mapped.IndiceStrategiqueOuvrage || '',
        noteGenerale: noteGenerale,
        photos: window.__photoStore[photoStructureId],
        objets: objetsListe,
        travaux: travaux,
        visits: visits
      };

      const cardHtml =
        '<div class="structure-card">' +
          '<h3>' + escapeHtml(nom) + '</h3>' +
          '<div class="structure-num">Ouvrage n°' + escapeHtml(rowId) + '</div>' +
          '<div class="row"><b>Domaine géographique :</b> ' + escapeHtml(domaineGeo) + '</div>' +
          '<div class="row"><b>Domaine :</b> ' + escapeHtml(classifDomaine) + '</div>' +
          '<div class="row"><b>Famille :</b> ' + escapeHtml(classifFamille) + '</div>' +
          '<div class="row"><b>Groupe :</b> ' + escapeHtml(classifGroupe) + '</div>' +
          '<div class="row"><b>Note de l\'ouvrage :</b> ' + noteGeneraleHtml + '</div>' +
          objetSelectHtml +
          '<div class="buttons" id="btns-default-' + objetUid + '">' +
            btnFiche +
            (lienFormulaire ? '<a class="btn btn-form" href="' + escapeHtml(lienFormulaire) + '" target="_blank" rel="noopener">➕ Créer une fiche visite</a>' : '') +
            '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + photoStructureId + '\', ' + jsStringLiteral(nom) + ');">📷 Photo(s) initial de l\'ouvrage</a>' +
            '<a class="btn btn-form" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + grilleEvalGlobalId + '\', ' + jsStringLiteral('Grilles d\'évaluation') + ');">📋 Grilles d\'évaluation</a>' +
            '<a class="btn btn-travaux" href="#" onclick="event.preventDefault(); window.showTravauxModal(\'' + travauxId + '\', ' + jsStringLiteral(nom) + ');">🚧 Historique des travaux</a>' +
            '<a class="btn btn-travaux-prevoir" href="#" onclick="event.preventDefault(); window.showTravauxAPrevoirModal(' + jsStringLiteral(travauxPrevoirKey) + ', ' + jsStringLiteral(nom) + ');">⚠️ Travaux à prévoir</a>' +
            btnVoirObjets +
            '<a class="btn btn-pdf-ouvrage" href="#" onclick="event.preventDefault(); window.exportOuvragePdf(\'' + ouvrageId + '\');">📥 Télécharger la fiche PDF</a>' +
          '</div>' +
          '<div class="buttons objet-buttons" id="btns-objet-' + objetUid + '" style="display:none;"></div>' +
          warningBox +
          warningBoxObjets +
        '</div>';

      attachHoverCard(marker, cardHtml);

      bounds.push([lat, lng]);
    } catch (err) {
      console.error('Erreur lors du traitement du groupe d\'ouvrage "' + key + '" :', err);
    }
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [20, 20] });
  }

  buildSearchPanel();

  // Si le mode visite est actif, on réapplique son filtre (les données viennent d'être reconstruites)
  if (visitModeActive) {
    if (map.hasLayer(layerGroup)) map.removeLayer(layerGroup);
    if (visitModeDate) {
      applyVisitModeFilter();
    } else {
      structureLayerGroup.clearLayers();
    }
  }
}

// -------------------------------------------------------------------
// Enregistrement d'une intervention "Travaux" directement dans la table
// Grist, sans passer par la vue tableau (utilisé par le formulaire du
// mode travaux ET par le formulaire d'ajout classique).
// -------------------------------------------------------------------
window.__saveTravauxRecord = async function (nomOuvrage, values) {
  // On construit nous-mêmes l'enregistrement brut à partir de l'objet de
  // correspondance (mappings) reçu de Grist, en ne prenant QUE les 5 colonnes
  // "Travaux" une par une. On n'utilise plus mapColumnNamesBack ici : dans ce
  // widget (qui a ~80 colonnes configurées au total), elle a provoqué des
  // écritures parasites vers d'autres colonnes (dont une colonne formule),
  // ce qui bloquait tout l'enregistrement.
  function getRawColId(friendlyName) {
    var mappings = window.__gristMappings || {};
    var raw = mappings[friendlyName];
    if (!raw) return null;
    // Si la colonne autorise une sélection multiple, Grist renvoie un tableau :
    // on prend alors le premier identifiant.
    if (Array.isArray(raw)) return raw.length > 0 ? raw[0] : null;
    return raw;
  }

  function buildRawRecord(dateValue) {
    var rawRecord = {};
    var pairs = [
      ['NomOuvrageTravail', nomOuvrage],
      ['DateTravail', dateValue],
      ['MecaniqueUsageTravail', values.mecaniqueUsage],
      ['TypeActionTravail', values.typeAction],
      ['CommentaireTravail', values.commentaire]
    ];
    var missing = [];
    for (var i = 0; i < pairs.length; i++) {
      var friendlyName = pairs[i][0];
      var value = pairs[i][1];
      var colId = getRawColId(friendlyName);
      if (colId) {
        rawRecord[colId] = value;
      } else {
        missing.push(friendlyName);
      }
    }
    return { rawRecord: rawRecord, missing: missing };
  }

  // Convertit "AAAA-MM-JJ" en nombre de secondes depuis epoch (format attendu
  // par les colonnes Grist de type Date/DateTime, contrairement au texte brut).
  function dateStringToEpochSeconds(dateStr) {
    if (!dateStr) return null;
    var parts = dateStr.split('-');
    if (parts.length !== 3) return null;
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
    if (!y || !m || !d) return null;
    return Math.floor(Date.UTC(y, m - 1, d) / 1000);
  }

  async function attemptCreate(dateValue) {
    var built = buildRawRecord(dateValue);
    if (Object.keys(built.rawRecord).length === 0) {
      throw new Error(
        'Aucune des colonnes "Travaux" n\'est mappée dans la configuration du widget. ' +
        'Ouvrez le panneau de configuration du widget (⚙️ en haut à droite) et associez ' +
        'les colonnes préfixées "🟧 Travaux" à de vraies colonnes de votre table.'
      );
    }
    if (built.missing.length > 0) {
      console.warn('Colonnes "Travaux" non mappées (ignorées à l\'enregistrement) : ' + built.missing.join(', '));
    }
    console.log('[Travaux] Envoi vers grist.selectedTable.create — fields :', built.rawRecord);
    return grist.selectedTable.create({ fields: built.rawRecord });
  }

  // 1ère tentative : la date telle que saisie (texte "AAAA-MM-JJ")
  try {
    await attemptCreate(values.date);
    return { ok: true };
  } catch (err1) {
    console.error('Échec de l\'enregistrement travaux (tentative 1, date en texte) :', err1);

    // 2e tentative : si la colonne cible est de type Date/DateTime, Grist attend
    // un nombre (secondes depuis epoch) et non une chaîne de texte.
    var epoch = dateStringToEpochSeconds(values.date);
    if (epoch !== null) {
      try {
        await attemptCreate(epoch);
        return { ok: true };
      } catch (err2) {
        console.error('Échec de l\'enregistrement travaux (tentative 2, date en epoch) :', err2);
        return { ok: false, message: (err2 && err2.message) ? err2.message : String(err2) };
      }
    }

    return { ok: false, message: (err1 && err1.message) ? err1.message : String(err1) };
  }
};

// Charge la planification du calendrier depuis les options du widget (persistée par Grist, sans colonne de table),
// et se met à jour automatiquement si elle est modifiée ailleurs (autre utilisateur, autre session).
try {
  grist.onOptions(function (options) {
    if (options && options.visitPlanning && Object.keys(options.visitPlanning).length > 0) {
      window.__visitPlanning = options.visitPlanning;
    } else {
      // Rien d'enregistré côté Grist : on tente de récupérer une éventuelle sauvegarde de secours locale
      try {
        const backup = localStorage.getItem('cerema-visit-planning-backup');
        window.__visitPlanning = backup ? JSON.parse(backup) : {};
      } catch (err) {
        window.__visitPlanning = {};
      }
    }
    if (document.getElementById('calendar-modal-overlay')) renderCalendarMonth();

    // Travaux à prévoir : note de planification interne (texte + standard/urgent), enregistrée dans
    // les options du widget Grist. Ne pilote plus le clignotement des pins (voir la case "Clignote
    // en rouge" sur la fiche de la visite la plus récente, lue directement depuis la table).
    if (options && options.travauxAPrevoir && Object.keys(options.travauxAPrevoir).length > 0) {
      window.__travauxAPrevoir = options.travauxAPrevoir;
    } else {
      try {
        const backupPrevoir = localStorage.getItem('cerema-travaux-a-prevoir-backup');
        window.__travauxAPrevoir = backupPrevoir ? JSON.parse(backupPrevoir) : {};
      } catch (err) {
        window.__travauxAPrevoir = {};
      }
    }
  });
} catch (err) {
  console.error('grist.onOptions indisponible : la planification du calendrier ne pourra pas être sauvegardée.', err);
}
