<script>
// -------------------------------------------------------------------
// 1) Parsing WKT : gère POLYGON(...) et MULTIPOLYGON(...), avec trous
// -------------------------------------------------------------------

// Découpe une chaîne en groupes de parenthèses de niveau 1 : "(a),(b)" -> ["(a)","(b)"]
function splitTopLevelParens(str) {
  const result = [];
  let depth = 0, start = -1;
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (c === '(') {
      if (depth === 0) start = i;
      depth++;
    } else if (c === ')') {
      depth--;
      if (depth === 0) result.push(str.slice(start + 1, i)); // sans les parenthèses
    }
  }
  return result;
}

// "lon lat, lon lat, ..." -> [[lat,lon], [lat,lon], ...] (Leaflet veut [lat, lon])
function parseRing(ringStr) {
  return ringStr.split(',').map(pair => {
    const parts = pair.trim().split(/\s+/).map(Number);
    return [parts[1], parts[0]]; // inverse lon/lat -> lat/lon
  });
}

// Retourne un tableau de polygones Leaflet-ready : [ [ring1, ring2(trou), ...], ... ]
function parseWKT(wkt) {
  if (!wkt || typeof wkt !== 'string') return [];
  wkt = wkt.trim();
  const upper = wkt.toUpperCase();

  try {
    if (upper.startsWith('MULTIPOLYGON')) {
      const outer = wkt.slice(wkt.indexOf('(') + 1, wkt.lastIndexOf(')'));
      // outer = "((ring1),(ring2)),((ring1))"
      const polygons = splitTopLevelParens(outer);
      return polygons.map(polyStr => {
        const rings = splitTopLevelParens(polyStr);
        return rings.map(parseRing);
      });
    }
    if (upper.startsWith('POLYGON')) {
      const outer = wkt.slice(wkt.indexOf('(') + 1, wkt.lastIndexOf(')'));
      const rings = splitTopLevelParens(outer);
      return [rings.map(parseRing)];
    }
  } catch (e) {
    console.error('Erreur de parsing WKT:', wkt, e);
  }
  return [];
}

const measureLayerGroup = L.layerGroup().addTo(map);

function formatDistance(meters) {
  if (meters < 1000) return Math.round(meters) + ' m';
  return (meters / 1000).toFixed(2) + ' km';
}

function makeMeasureLabelIcon(text) {
  return L.divIcon({
    className: 'measure-label-icon',
    html: '<div class="measure-label">' + text + '</div>',
    iconSize: [0, 0]
  });
}

function updateMeasureLine(latlng) {
  if (!measureLine || !measureStartLatLng) return;
  measureLine.setLatLngs([measureStartLatLng, latlng]);
  const dist = map.distance(measureStartLatLng, latlng);
  const midLat = (measureStartLatLng.lat + latlng.lat) / 2;
  const midLng = (measureStartLatLng.lng + latlng.lng) / 2;
  if (measureLabelMarker) {
    measureLabelMarker.setLatLng([midLat, midLng]);
    measureLabelMarker.setIcon(makeMeasureLabelIcon(formatDistance(dist)));
  }
}

function onMeasureClick(latlng) {
  if (!measureStartLatLng) {
    // Premier clic : point de départ (on repart d'une mesure propre)
    measureLayerGroup.clearLayers();
    measureStartLatLng = latlng;
    measureLine = L.polyline([latlng, latlng], { color: '#e53935', weight: 3, dashArray: '6,8' }).addTo(measureLayerGroup);
    L.circleMarker(latlng, { radius: 5, color: '#e53935', fillColor: '#e53935', fillOpacity: 1, weight: 2 }).addTo(measureLayerGroup);
    measureLabelMarker = L.marker(latlng, { icon: makeMeasureLabelIcon('0 m'), interactive: false }).addTo(measureLayerGroup);
  } else {
    // Second clic : point d'arrivée, la mesure est figée
    updateMeasureLine(latlng);
    L.circleMarker(latlng, { radius: 5, color: '#e53935', fillColor: '#e53935', fillOpacity: 1, weight: 2 }).addTo(measureLayerGroup);
    measureStartLatLng = null;
    measureLine = null;
    measureLabelMarker = null;
  }
}

  const onSuccess = () => showCoordToast('📋 Coordonnées copiées : ' + coordText);
  const onError = () => showCoordToast('⚠️ Impossible de copier automatiquement : ' + coordText);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(coordText).then(onSuccess).catch(onError);
  } else {
    // Repli pour les navigateurs/contextes ne supportant pas l'API Clipboard moderne
    try {
      const textarea = document.createElement('textarea');
      textarea.value = coordText;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      onSuccess();
    } catch (err) {
      onError();
    }
  }
});

// Récupère un jeton d'accès court terme pour construire les URLs de pièces jointes
async function getFreshAccessToken() {
  return await grist.docApi.getAccessToken({ readOnly: true });
}

function buildAttachmentUrl(tokenInfo, attachmentId) {
  return tokenInfo.baseUrl + '/attachments/' + attachmentId + '/download?auth=' + tokenInfo.token;
}

// value peut être : vide, une URL en texte, ou un tableau d'ids (colonne Pièce jointe Grist)
function resolveImageValue(value, tokenInfo) {
  if (!value) return '';
  if (Array.isArray(value)) {
    if (value.length === 0) return '';
    // Ignore un éventuel préfixe d'encodage Grist ('L' pour "list") si présent en première position
    const items = (value[0] === 'L') ? value.slice(1) : value;
    if (items.length === 0) return '';
    const first = items[0];
    const id = typeof first === 'number' ? first : (typeof first === 'string' && /^\d+$/.test(first) ? Number(first) : null);
    if (id !== null && tokenInfo) return buildAttachmentUrl(tokenInfo, id);
    return '';
  }
  return String(value).trim();
}

// Convertit un texte en nombre en gérant la virgule décimale française ("43,6047" -> 43.6047)
function parseFrenchNumber(value) {
  if (value === null || value === undefined || value === '') return NaN;
  if (typeof value === 'number') return value;
  return Number(String(value).trim().replace(',', '.'));
}

// Clé de regroupement d'une structure : par nom (prioritaire) sinon par coordonnées GPS arrondies
function structureGroupKey(mapped) {
  const name = (mapped.NomStructure || '').toString().trim().toLowerCase();
  if (name) return 'name:' + name;
  const lat = parseFrenchNumber(mapped.Latitude);
  const lng = parseFrenchNumber(mapped.Longitude);
  if (Number.isFinite(lat) && Number.isFinite(lng) && !(lat === 0 && lng === 0)) {
    return 'coord:' + lat.toFixed(5) + ',' + lng.toFixed(5);
  }
  return null;
}

// Essaie d'interpréter une date de visite (nombre Grist en secondes, texte JJ/MM/AAAA, ou texte générique)
function parseVisitDate(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') {
    const d = new Date(raw * 1000); // Grist encode les dates en secondes depuis epoch
    return isNaN(d.getTime()) ? null : d;
  }
  const str = String(raw).trim();
  const frMatch = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (frMatch) {
    const d = new Date(parseInt(frMatch[3], 10), parseInt(frMatch[2], 10) - 1, parseInt(frMatch[1], 10));
    return isNaN(d.getTime()) ? null : d;
  }
  const d2 = new Date(str);
  return isNaN(d2.getTime()) ? null : d2;
}

// Construit le libellé d'onglet "Visite du JJ/MM/AAAA"
function formatVisitLabel(raw) {
  const d = parseVisitDate(raw);
  if (d) return 'Visite du ' + d.toLocaleDateString('fr-FR');
  if (raw) return 'Visite du ' + String(raw);
  return 'Visite (date inconnue)';
}

// -------------------------------------------------------------------
// Détection géographique : une structure est-elle à l'intérieur d'un polygone de domaine ?
// -------------------------------------------------------------------

// Test "point dans un anneau" par ray-casting. point = [lat, lng], ring = [[lat,lng], ...]
function pointInRing(point, ring) {
  const [py, px] = point; // on utilise (lat, lng) comme (y, x)
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const yi = ring[i][0], xi = ring[i][1];
    const yj = ring[j][0], xj = ring[j][1];
    const intersect = ((yi > py) !== (yj > py)) &&
      (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// Un "polygone" ici = [anneauExterieur, trou1, trou2, ...] (format retourné par parseWKT)
function pointInPolygonWithHoles(point, rings) {
  if (!rings || rings.length === 0) return false;
  if (!pointInRing(point, rings[0])) return false; // pas dans l'anneau extérieur
  for (let i = 1; i < rings.length; i++) {
    if (pointInRing(point, rings[i])) return false; // dans un trou -> exclu
  }
  return true;
}

// Cherche le nom du premier domaine dont un des polygones contient ce point
function findDomaineForPoint(lat, lng, domainePolygonsList) {
  const point = [lat, lng];
  for (const entry of domainePolygonsList) {
    for (const rings of entry.polygons) {
      if (pointInPolygonWithHoles(point, rings)) return entry.name;
    }
  }
  return null;
}

// Convertit une valeur quelconque (texte, email, référence Grist, liste) en texte lisible
function formatTextValue(value) {
  if (value === null || value === undefined || value === '') return '';
  if (Array.isArray(value)) {
    // Ignore un éventuel préfixe d'encodage Grist ('L' pour "list")
    const items = (value[0] === 'L') ? value.slice(1) : value;
    return items.map(formatTextValue).filter(Boolean).join(', ');
  }
  if (typeof value === 'object') {
    const name = value.name || value.Name || value.label || '';
    const email = value.email || value.Email || '';
    const combined = [name, email].filter(Boolean).join(' - ');
    return combined || JSON.stringify(value);
  }
  return String(value);
}

// Formate une date pour l'affichage : gère les nombres (colonnes Date Grist = secondes epoch) et le texte brut
function formatDateValue(value) {
  if (value === null || value === undefined || value === '') return '';
  if (typeof value === 'number') {
    const d = new Date(value * 1000);
    if (!isNaN(d.getTime())) return d.toLocaleDateString('fr-FR');
  }
  return String(value);
}

// Retourne une clé de tri (timestamp) pour ordonner les visites de la plus récente à la plus ancienne
function dateSortKey(value) {
  if (typeof value === 'number') return value;
  if (typeof value === 'string' && value.trim() !== '') {
    const parsed = Date.parse(value);
    if (!isNaN(parsed)) return parsed / 1000;
  }
  return -Infinity;
}

// Échappe le texte pour éviter de casser le HTML si un nom contient des caractères spéciaux
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Résout une liste de photos (URL ou pièce jointe Grist) et retourne le HTML des emplacements
async function resolvePhotoSlotsHtml(photos) {
  let tokenInfo = null;
  let tokenError = '';
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
    tokenError = 'Erreur d\'accès aux pièces jointes : ' + (e && e.message ? e.message : e);
  }

  return photos.map((p, i) => {
    const hasRawValue = Array.isArray(p.url) ? p.url.length > 0 : !!p.url;
    const src = resolveImageValue(p.url, tokenInfo);
    let img;
    if (src) {
      img = '<img src="' + escapeHtml(src) + '" alt="photo" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'), {className:\'no-photo\', textContent:\'Image inaccessible (voir console)\'}))" />';
    } else if (hasRawValue && tokenError) {
      img = '<div class="no-photo">' + escapeHtml(tokenError) + '</div>';
      console.error('Photo ' + (i + 1) + ' : valeur brute présente mais non résolue ->', p.url);
    } else if (hasRawValue) {
      img = '<div class="no-photo">Format de pièce jointe non reconnu (voir console)</div>';
      console.error('Photo ' + (i + 1) + ' : format de valeur inattendu ->', p.url);
    } else {
      img = '<div class="no-photo">Aucune photo</div>';
    }
    const desc = '<div class="desc">' + escapeHtml(p.desc || '—') + '</div>';
    return '<div class="photo-slot">' + img + desc + '</div>';
  }).join('');
}

// Construit et affiche la fenêtre modale avec les photos + descriptions
window.showPhotoModal = async function (storeId, title) {
  window.closePhotoModal();

  const photos = window.__photoStore[storeId] || [];

  const overlay = document.createElement('div');
  overlay.className = 'photo-modal-overlay';
  overlay.id = 'photo-modal-overlay';
  overlay.onclick = function (e) { if (e.target === overlay) window.closePhotoModal(); };
  overlay.innerHTML =
    '<div class="photo-modal">' +
      '<button class="close-btn" onclick="window.closePhotoModal()">&times;</button>' +
      '<h3>' + escapeHtml(title || 'Photos') + '</h3>' +
      '<div class="photo-grid"><p>Chargement des photos…</p></div>' +
    '</div>';
  document.body.appendChild(overlay);

  const slotsHtml = await resolvePhotoSlotsHtml(photos);

  // Le modal peut avoir été fermé pendant le chargement ; on ne réinjecte que s'il est toujours ouvert
  const stillOpen = document.getElementById('photo-modal-overlay');
  if (stillOpen) {
    const grid = stillOpen.querySelector('.photo-grid');
    if (grid) grid.innerHTML = slotsHtml;
  }
};

// Construit et affiche la fiche de visite (une ou plusieurs visites, avec onglets si plusieurs)
window.showFicheModal = async function (storeId) {
  window.closePhotoModal();

  const group = window.__ficheStore[storeId];
  if (!group || !group.visits || group.visits.length === 0) return;

  const visits = group.visits;
  const showTabs = visits.length > 1;

  const tabsHtml = showTabs
    ? '<div class="fiche-tabs">' + visits.map((v, i) =>
        '<button class="fiche-tab' + (i === 0 ? ' active' : '') + '" onclick="window.__ficheSwitchTab(\'' + storeId + '\', ' + i + ', this)">' +
        escapeHtml(v.label) + '</button>'
      ).join('') + '</div>'
    : '';

  const overlay = document.createElement('div');
  overlay.className = 'photo-modal-overlay';
  overlay.id = 'photo-modal-overlay';
  overlay.onclick = function (e) { if (e.target === overlay) window.closePhotoModal(); };
  overlay.innerHTML =
    '<div class="photo-modal fiche-modal">' +
      '<button class="close-btn" onclick="window.closePhotoModal()">&times;</button>' +
      '<h3>📄 ' + (showTabs ? 'Fiches visites' : 'Fiche visite') + '</h3>' +
      tabsHtml +
      '<div id="fiche-content-area"><p>Chargement…</p></div>' +
      '<button class="btn btn-form fiche-pdf-btn" onclick="window.exportFicheToPdf()">🖨️ Exporter en PDF</button>' +
    '</div>';
  document.body.appendChild(overlay);

  window.__activeFicheStoreId = storeId;
  window.__activeFicheVisitIdx = 0;

  await window.__ficheRenderTab(storeId, 0);
};

// Affiche le contenu (infos + photos) d'une visite précise dans la fiche déjà ouverte
window.__ficheRenderTab = async function (storeId, idx) {
  const group = window.__ficheStore[storeId];
  if (!group) return;
  const visit = group.visits[idx];
  if (!visit) return;

  const rowsHtml =
    '<div class="modal-row"><b>Inspecteur(s) :</b> ' + escapeHtml(visit.data.inspecteurs || '—') + '</div>' +
    '<div class="modal-row"><b>Date de la visite :</b> ' + escapeHtml(visit.data.date || '—') + '</div>' +
    '<div class="modal-row"><b>Nom complet structure :</b> ' + escapeHtml(visit.data.nomComplet || '—') + '</div>' +
    '<div class="modal-row"><b>Description :</b> ' + escapeHtml(visit.data.description || '—') + '</div>' +
    '<div class="modal-row"><b>État structurel :</b> ' + escapeHtml(visit.data.etatStructurel || '—') + '</div>' +
    '<div class="modal-row"><b>État sécurité usager :</b> ' + escapeHtml(visit.data.etatSecurite || '—') + '</div>';

  const contentArea = document.getElementById('fiche-content-area');
  if (contentArea) {
    contentArea.innerHTML = rowsHtml + '<div class="photo-grid" style="margin-top:16px;"><p>Chargement des photos…</p></div>';
  }

    if (grid) grid.innerHTML = slotsHtml;

// Change l'onglet actif (visite affichée) dans la fiche
window.__ficheSwitchTab = function (storeId, idx, btnEl) {
  const overlay = document.getElementById('photo-modal-overlay');
  if (overlay) {
    overlay.querySelectorAll('.fiche-tab').forEach(btn => btn.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');
  }
  window.__activeFicheVisitIdx = idx;
  window.__ficheRenderTab(storeId, idx);
};

// Construit une belle fiche imprimable (indépendante de la fenêtre interactive) et lance l'impression/export PDF
window.exportFicheToPdf = async function () {
  const storeId = window.__activeFicheStoreId;
  const idx = window.__activeFicheVisitIdx || 0;
  const group = window.__ficheStore[storeId];
  if (!group) return;
  const visit = group.visits[idx];
  if (!visit) return;

  const container = document.getElementById('pdf-export-container');
  if (!container) return;

  // Affiche d'abord un état "chargement" (au cas où la résolution des photos prendrait un instant)
  container.innerHTML = '<p>Préparation du document…</p>';

  const photosHtml = await buildPdfPhotosHtml(visit.data.photos);

  container.innerHTML =
    '<div class="pdf-header">' +
      '<h1>📄 Fiche de visite</h1>' +
      '<div class="pdf-header-sub">' + escapeHtml(visit.data.nomComplet || '—') + '</div>' +
    '</div>' +
    '<table class="pdf-info-table">' +
      '<tr>' +
        '<th>Inspecteur(s)</th><td>' + escapeHtml(visit.data.inspecteurs || '—') + '</td>' +
        '<th>Date de la visite</th><td>' + escapeHtml(visit.data.date || '—') + '</td>' +
      '</tr>' +
      '<tr>' +
        '<th>État structurel</th><td>' + escapeHtml(visit.data.etatStructurel || '—') + '</td>' +
        '<th>État sécurité usager</th><td>' + escapeHtml(visit.data.etatSecurite || '—') + '</td>' +
      '</tr>' +
    '</table>' +
    '<div class="pdf-section">' +
      '<h3>Description</h3>' +
      '<p>' + escapeHtml(visit.data.description || '—') + '</p>' +
    '</div>' +
    '<div class="pdf-section">' +
      '<h3>Photos</h3>' +
      '<div class="pdf-photo-grid">' + photosHtml + '</div>' +
    '</div>' +
    '<div class="pdf-footer">Carte interactive développée par l\'agence d\'Angers du Cerema</div>';

  // Attend que toutes les images soient réellement chargées (sinon l'impression peut se déclencher
  // avant qu'elles n'apparaissent, donnant des cases vides dans le PDF)
  await waitForImagesToLoad(container);

  window.print();
};

// Attend que toutes les <img> d'un conteneur aient fini de charger (ou aient échoué), avant de continuer
function waitForImagesToLoad(container) {
  const imgs = Array.from(container.querySelectorAll('img'));
  return Promise.all(imgs.map(img => {
    if (img.complete) return Promise.resolve();
    return new Promise(resolve => {
      img.addEventListener('load', resolve, { once: true });
      img.addEventListener('error', resolve, { once: true });
    });
  }));
}

// Construit le HTML des photos pour l'export PDF (ignore silencieusement les emplacements vides)
async function buildPdfPhotosHtml(photos) {
  let tokenInfo = null;
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
  }

  const nonEmpty = (photos || []).filter(p => Array.isArray(p.url) ? p.url.length > 0 : !!p.url);
  if (nonEmpty.length === 0) return '<p class="pdf-no-photo">Aucune photo disponible.</p>';

  return nonEmpty.map(p => {
    const src = resolveImageValue(p.url, tokenInfo);
    const img = src ? '<img src="' + escapeHtml(src) + '" alt="photo" />' : '';
    const desc = p.desc ? '<div class="pdf-photo-desc">' + escapeHtml(p.desc) + '</div>' : '';
    return '<div class="pdf-photo-item">' + img + desc + '</div>';
  }).join('');
}

// Échappe une chaîne pour l'insérer en toute sécurité comme littéral JS entre apostrophes,
// utilisé dans les attributs onclick="..." (qui eux sont entre guillemets doubles)
function jsStringLiteral(str) {
  return "'" + String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, ' ') + "'";
}

window.closePhotoModal = function () {
  const el = document.getElementById('photo-modal-overlay');
  if (el) el.remove();
};

// -------------------------------------------------------------------
// Calendrier des visites prévues
// -------------------------------------------------------------------
// La planification (quelle structure est prévue quel jour) N'EST PAS stockée dans une colonne
// de la table Grist : elle est enregistrée dans les OPTIONS du widget lui-même (grist.setOption /
// grist.onOptions), ce qui persiste dans le document Grist sans jamais toucher au schéma de la table.

const CALENDAR_WEEKDAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const CALENDAR_MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function calendarDateKey(year, monthIndex, day) { return year + '-' + pad2(monthIndex + 1) + '-' + pad2(day); }

// Enregistre la planification courante dans les options du widget (persisté par Grist, partagé entre utilisateurs).
// Asynchrone et avec confirmation visuelle, car grist.setOption() est un appel réseau : sans l'attendre,
// un échec (ex. droits d'accès, connexion) passait inaperçu et la planification semblait "disparaître" au rafraîchissement.
async function saveVisitPlanning(showFeedback) {
  let ok = false;
  try {
    await grist.setOption('visitPlanning', window.__visitPlanning);
    ok = true;
  } catch (err) {
    console.error('Impossible d\'enregistrer la planification des visites dans les options du widget Grist :', err);
  }
  try {
    localStorage.setItem('cerema-visit-planning-backup', JSON.stringify(window.__visitPlanning));
  } catch (err) { /* pas grave, sauvegarde locale seulement en secours */ }

  if (showFeedback) {
    showCoordToast(ok ? '💾 Planification enregistrée' : '⚠️ Échec de l\'enregistrement, réessayez');
  }
  return ok;
}

// Bouton "Enregistrer" du calendrier : sauvegarde immédiate et explicite, avec confirmation visible

window.closeCalendarModal = function () {
  const el = document.getElementById('calendar-modal-overlay');
  if (el) el.remove();
};

window.__calendarPrevMonth = function () {
  const d = window.__calendarViewDate;
  window.__calendarViewDate = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  renderCalendarMonth();
};
window.__calendarNextMonth = function () {
  const d = window.__calendarViewDate;
  window.__calendarViewDate = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  renderCalendarMonth();
};
window.__calendarToday = function () {
  const now = new Date();
  window.__calendarViewDate = new Date(now.getFullYear(), now.getMonth(), 1);
  renderCalendarMonth();
};

function renderCalendarMonth() {
  const body = document.getElementById('calendar-modal-body');
  const label = document.getElementById('calendar-month-label');
  if (!body || !label) return;

  const viewDate = window.__calendarViewDate;
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  label.textContent = CALENDAR_MONTHS[month] + ' ' + year;

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // lundi = 0 ... dimanche = 6
  const gridStart = new Date(year, month, 1 - startOffset);

  const now = new Date();
  const todayKey = calendarDateKey(now.getFullYear(), now.getMonth(), now.getDate());

  let cellsHtml = '';
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const key = calendarDateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const isOtherMonth = cellDate.getMonth() !== month;
    const isToday = key === todayKey;
    const visits = window.__visitPlanning[key] || [];

    const chipsHtml = visits.map(function (v, vi) {
      return '<div class="calendar-visit-chip">' +
        '<span class="calendar-visit-chip-name" title="' + escapeHtml(v.nom) + '" onclick="window.__calendarGoToVisit(' + jsStringLiteral(key) + ', ' + vi + ')">' + escapeHtml(v.nom) + '</span>' +
        '<span class="calendar-visit-chip-remove" title="Retirer" onclick="window.__removeVisit(' + jsStringLiteral(key) + ', ' + vi + ')">&times;</span>' +
      '</div>';
    }).join('');

    cellsHtml +=
      '<div class="calendar-day' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '') + '">' +
        '<div class="calendar-day-top">' +
          '<span class="calendar-day-num">' + cellDate.getDate() + '</span>' +
          '<button class="calendar-day-add" title="Ajouter une visite ce jour" onclick="window.__openCalendarAddDialog(' + jsStringLiteral(key) + ')">+</button>' +
        '</div>' +
        '<div class="calendar-day-visits">' + chipsHtml + '</div>' +
      '</div>';
  }

  body.innerHTML =
    '<div class="calendar-weekdays">' + CALENDAR_WEEKDAYS.map(function (w) { return '<div class="calendar-weekday">' + w + '</div>'; }).join('') + '</div>' +
    '<div class="calendar-grid">' + cellsHtml + '</div>';
}

// ---- Export du planning du mois affiché en PDF (via la boîte de dialogue d'impression du navigateur) ----
// Réutilise le même conteneur #pdf-export-container que l'export de fiche de visite, pour bénéficier
// du même mécanisme d'impression déjà en place (masquage du reste de la page, mise en page A4/print).

// Construit le HTML de la grille imprimable pour un mois donné, à partir de la même
// planification (window.__visitPlanning) que celle affichée à l'écran.
function buildCalendarPrintHtml(year, month) {
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7; // lundi = 0 ... dimanche = 6
  const gridStart = new Date(year, month, 1 - startOffset);

  let cellsHtml = '';
  for (let i = 0; i < 42; i++) {
    const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const key = calendarDateKey(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
    const isOtherMonth = cellDate.getMonth() !== month;
    const visits = window.__visitPlanning[key] || [];

    const visitsHtml = visits.map(function (v) {
      return '<div class="pdf-calendar-visit">' + escapeHtml(v.nom) + '</div>';
    }).join('');

    cellsHtml +=
      '<div class="pdf-calendar-day' + (isOtherMonth ? ' other-month' : '') + '">' +
        '<div class="pdf-calendar-day-num">' + cellDate.getDate() + '</div>' +
        visitsHtml +
      '</div>';
  }

  return (
    '<div class="pdf-header">' +
      '<h1>🗓️ Planning des visites</h1>' +
      '<div class="pdf-header-sub">' + CALENDAR_MONTHS[month] + ' ' + year + '</div>' +
    '</div>' +
    '<div class="pdf-calendar-weekdays">' + CALENDAR_WEEKDAYS.map(function (w) { return '<div class="pdf-calendar-weekday">' + w + '</div>'; }).join('') + '</div>' +
    '<div class="pdf-calendar-grid">' + cellsHtml + '</div>' +
    '<div class="pdf-footer">Carte interactive développée par l\'agence d\'Angers du Cerema</div>'
  );
}

// Déclenche l'export PDF du mois actuellement affiché dans le calendrier.
window.__exportCalendarPDF = function () {
  try {
    const viewDate = window.__calendarViewDate;
    if (!viewDate) {
      console.warn('Export PDF planning : aucun mois affiché (window.__calendarViewDate manquant).');
      showCoordToast('⚠️ Ouvrez le calendrier avant d\'exporter');
      return;
    }

    const container = document.getElementById('pdf-export-container');
    if (!container) {
      console.error('Export PDF planning : #pdf-export-container introuvable dans le DOM.');
      showCoordToast('⚠️ Erreur : conteneur d\'export introuvable');
      return;
    }

    const html = buildCalendarPrintHtml(viewDate.getFullYear(), viewDate.getMonth());
    container.innerHTML = html;
    console.log('Export PDF planning : contenu généré (' + html.length + ' caractères) pour ' + CALENDAR_MONTHS[viewDate.getMonth()] + ' ' + viewDate.getFullYear() + '.');

    window.print();
  } catch (err) {
    console.error('Erreur lors de l\'export PDF du planning :', err);
    showCoordToast('⚠️ Échec de l\'export PDF (voir la console)');
  }
};

// ---- Boîte de dialogue "Ajouter une visite" : menu déroulant + zone de recherche texte ----

window.__calendarAddDate = null;
window.__calendarAddOptions = [];

window.__openCalendarAddDialog = function (dateKey) {
  window.__calendarAddDate = dateKey;

  // Liste des structures disponibles (issues des données Grist déjà chargées sur la carte),
  // dédupliquée par nom (insensible à la casse/espaces) pour qu'une structure n'apparaisse qu'une seule fois,
  // puis triée par nom
  const seenNames = new Set();
  window.__calendarAddOptions = (window.__structureRegistry || [])
    .filter(function (e) { return e.nom; })
    .filter(function (e) {
      const key = normalizeForSearch(e.nom);
      if (seenNames.has(key)) return false;
      seenNames.add(key);
      return true;
    })
    .map(function (e) { return { rowId: e.rowId, nom: e.nom }; })
    .sort(function (a, b) { return a.nom.localeCompare(b.nom, 'fr'); });

  const parts = dateKey.split('-');
  const dateObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const dateLabel = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const overlay = document.createElement('div');
  overlay.className = 'photo-modal-overlay calendar-add-overlay';
  overlay.id = 'calendar-add-overlay';
  overlay.onclick = function (e) { if (e.target === overlay) window.closeCalendarAddDialog(); };
  overlay.innerHTML =
    '<div class="photo-modal calendar-add-modal">' +
      '<button class="close-btn" onclick="window.closeCalendarAddDialog()">&times;</button>' +
      '<h3>Ajouter une visite</h3>' +
      '<div class="calendar-add-date">' + escapeHtml(dateLabel) + '</div>' +
      '<input type="text" id="calendar-add-search" class="calendar-add-search" placeholder="Rechercher une structure..." autocomplete="off" oninput="window.__filterCalendarAddOptions(this.value)" />' +
      '<select id="calendar-add-select" class="calendar-add-select" size="8"></select>' +
      '<div class="calendar-add-empty" id="calendar-add-empty" style="display:none;">Aucune structure trouvée pour cette recherche. Cliquez sur "Ajouter" pour enregistrer tout de même le nom saisi.</div>' +
      '<div class="calendar-add-actions">' +
        '<button class="btn btn-form" onclick="window.__confirmAddVisit()">Ajouter</button>' +
        '<button class="btn btn-maps" onclick="window.closeCalendarAddDialog()">Annuler</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);

  window.__filterCalendarAddOptions('');
  const searchInput = document.getElementById('calendar-add-search');
  if (searchInput) searchInput.focus();
};

window.__filterCalendarAddOptions = function (query) {
  const q = normalizeForSearch(query);
  const select = document.getElementById('calendar-add-select');
  const emptyBox = document.getElementById('calendar-add-empty');
  if (!select) return;
  const filtered = window.__calendarAddOptions.filter(function (o) { return !q || normalizeForSearch(o.nom).includes(q); });
  select.innerHTML = filtered.map(function (o) {
    return '<option value="' + (o.rowId != null ? o.rowId : '') + '">' + escapeHtml(o.nom) + '</option>';
  }).join('');
  if (emptyBox) emptyBox.style.display = filtered.length === 0 ? 'block' : 'none';
  if (filtered.length > 0) select.selectedIndex = 0;
};

window.closeCalendarAddDialog = function () {
  const el = document.getElementById('calendar-add-overlay');
  if (el) el.remove();
};

window.__confirmAddVisit = function () {
  const select = document.getElementById('calendar-add-select');
  const searchInput = document.getElementById('calendar-add-search');
  const dateKey = window.__calendarAddDate;
  if (!dateKey) return;

  let entry = null;
  if (select && select.selectedOptions && select.selectedOptions.length > 0 && select.value !== '') {
    const opt = select.selectedOptions[0];
    entry = { rowId: opt.value ? Number(opt.value) : null, nom: opt.textContent };
  } else if (searchInput && searchInput.value.trim() !== '') {
    // Aucune structure correspondante dans la liste : le nom tapé est enregistré tel quel
    entry = { rowId: null, nom: searchInput.value.trim() };
  }
  if (!entry) { window.closeCalendarAddDialog(); return; }

  if (!window.__visitPlanning[dateKey]) window.__visitPlanning[dateKey] = [];
  window.__visitPlanning[dateKey].push(entry);
  saveVisitPlanning(true);

  window.closeCalendarAddDialog();
  renderCalendarMonth();
};

window.__removeVisit = function (dateKey, idx) {
  if (!window.__visitPlanning[dateKey]) return;
  window.__visitPlanning[dateKey].splice(idx, 1);
  if (window.__visitPlanning[dateKey].length === 0) delete window.__visitPlanning[dateKey];
  saveVisitPlanning(true);
  renderCalendarMonth();
};

window.__calendarGoToVisit = function (dateKey, idx) {
  const visits = window.__visitPlanning[dateKey] || [];
  const visit = visits[idx];
  if (!visit || visit.rowId == null) return;
  const entry = (window.__structureRegistry || []).find(function (e) { return e.rowId === visit.rowId; });
  if (entry && entry.marker) {
    window.closeCalendarModal();
    const latlng = entry.marker.getLatLng();
    map.setView(latlng, Math.max(map.getZoom(), 16));
    entry.marker.openPopup();
  }
};

// Attache un popup qui s'ouvre au survol et reste ouvert tant que la souris
// est sur la couche (marqueur ou polygone) OU sur l'encadré lui-même (pour pouvoir cliquer les boutons)
function attachHoverCard(layer, contentHtml, extraOptions) {
  layer.bindPopup(contentHtml, Object.assign({
    closeButton: true,
    autoClose: false,
    closeOnClick: false,
    className: 'structure-popup'
  }, extraOptions || {}));

  let closeTimer = null;
  const cancelClose = () => { if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; } };
  const scheduleClose = () => { closeTimer = setTimeout(() => layer.closePopup(), 1000); };

  // Événements Leaflet (fonctionnent dans la plupart des cas)
  layer.on('mouseover', () => { cancelClose(); layer.openPopup(); });
  layer.on('mouseout', scheduleClose);

  // Renfort : écouteurs DOM natifs directement sur l'élément, plus fiables
  // avec certaines icônes personnalisées (image/SVG) selon les navigateurs
  layer.on('add', () => {
    const el = layer.getElement ? layer.getElement() : null;
    if (el) {
      el.addEventListener('mouseenter', () => { cancelClose(); layer.openPopup(); });
      el.addEventListener('mouseleave', scheduleClose);
    }
  });

  layer.on('popupopen', (e) => {
    const el = e.popup.getElement();
    if (el) {
      el.addEventListener('mouseenter', cancelClose);
      el.addEventListener('mouseleave', scheduleClose);
      // Filets de sécurité : tout mouvement ou clic dans l'encadré annule la fermeture programmée
      el.addEventListener('mousemove', cancelClose);
      el.addEventListener('mousedown', cancelClose);
      el.addEventListener('click', cancelClose);
    }
  });
}

// Crée l'icône d'un marqueur "Structure" : soit une image fournie, soit un pin rouge par défaut
function createStructureIcon(imageUrl, color) {
  const url = imageUrl ? String(imageUrl).trim() : '';
  if (url !== '') {
    return L.icon({
      iconUrl: url,
      iconSize: [68, 68],      // taille x2 par rapport à avant (34 -> 68)
      iconAnchor: [34, 68],
      popupAnchor: [0, -68]
    });
  }

  // Pin SVG par défaut (rouge, ou couleur personnalisée si CouleurStructure est renseignée)
  const fill = color || '#e53935';
  const pinSvg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">' +
    '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 26 14 26s14-15.5 14-26C28 6.3 21.7 0 14 0z" ' +
    'fill="' + fill + '" stroke="#00000055" stroke-width="1"/>' +
    '<circle cx="14" cy="14" r="6" fill="#fff"/>' +
    '</svg>';

  return L.divIcon({
    html: pinSvg,
    className: '', // évite le style par défaut de Leaflet (fond blanc carré)
    iconSize: [28, 40],
    iconAnchor: [14, 40],
    popupAnchor: [0, -40]
  });
}

// -------------------------------------------------------------------
// Panneau de recherche / filtre hiérarchique Domaine > Famille > Groupe
// -------------------------------------------------------------------

function normalizeForSearch(str) {
  return String(str || '').trim().toLowerCase();
}

// Affiche uniquement les structures du registre qui satisfont le prédicat ; ajuste la vue
function applyStructureFilter(predicate) {
  structureLayerGroup.clearLayers();
  const matchedLatLngs = [];
  window.__structureRegistry.forEach(entry => {
    if (!entry.marker) return;
    if (predicate(entry)) {
      entry.marker.addTo(structureLayerGroup);
      matchedLatLngs.push(entry.marker.getLatLng());
    }
  });

  const noResultBox = document.getElementById('structure-no-result');
  if (noResultBox) noResultBox.style.display = matchedLatLngs.length === 0 ? 'block' : 'none';

  if (matchedLatLngs.length > 0) {
    map.fitBounds(matchedLatLngs, { padding: [40, 40], maxZoom: 16 });
  }
}

function resetStructureFilter() {
  applyStructureFilter(() => true);
}

window.__resetStructureSearch = function () {
  const input = document.getElementById('structure-search-input');
  if (input) input.value = '';
  resetStructureFilter();
};

window.__onStructureSearchInput = function (value) {
  const q = normalizeForSearch(value);
  if (!q) { resetStructureFilter(); return; }
  applyStructureFilter(entry => normalizeForSearch(entry.nom).includes(q));
};

// Va directement à la structure sur la carte (zoom + ouverture de son encadré)
window.__goToStructure = function (idx) {
  const entry = window.__structureRegistry[idx];
  if (!entry || !entry.marker) return;
  const latlng = entry.marker.getLatLng();
  map.setView(latlng, Math.max(map.getZoom(), 16));
  entry.marker.openPopup();
};

// Ouvre/ferme un nœud de l'arbre (domaine, famille ou groupe)
window.__toggleTreeNode = function (arrowEl) {
  const row = arrowEl.parentElement;
  const childrenDiv = row.nextElementSibling;
  if (childrenDiv && childrenDiv.classList.contains('tree-children')) {
    const opening = !childrenDiv.classList.contains('open');
    childrenDiv.classList.toggle('open', opening);
    arrowEl.textContent = opening ? '▾' : '▸';
  }
};

// Ouvre/ferme le panneau complet de l'arbre (flèche à côté du champ de recherche)
window.__toggleTreePanel = function () {
  const treeDiv = document.getElementById('structure-tree');
  if (treeDiv) treeDiv.classList.toggle('open');
};

// (Re)construit le panneau de recherche : arbre en cascade Domaine > Famille > Groupe > Structure(s)
function buildSearchPanel() {
  let panel = document.getElementById('structure-search-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'structure-search-panel';
    panel.className = 'structure-search-panel';
    document.body.appendChild(panel);
  }

  // domaineTree : Map(domaine -> Map(famille -> Map(groupe -> [indices dans __structureRegistry])))
  // rootFamilies : idem mais pour les familles SANS domaine renseigné (affichées à la racine)
  const domaineTree = new Map();
  const rootFamilies = new Map();

  // Ajoute une combinaison domaine/famille/groupe (avec ou sans structure associée) dans l'arbre
  function addToTree(domaine, famille, groupe, structureIdx) {
    const f = famille && famille.trim() ? famille.trim() : 'Non renseigné';
    const g = groupe && groupe.trim() ? groupe.trim() : 'Non renseigné';
    const d = domaine && domaine.trim() ? domaine.trim() : '';

    let groupeMap;
    if (d) {
      if (!domaineTree.has(d)) domaineTree.set(d, new Map());
      if (!domaineTree.get(d).has(f)) domaineTree.get(d).set(f, new Map());
      groupeMap = domaineTree.get(d).get(f);
    } else {
      if (!rootFamilies.has(f)) rootFamilies.set(f, new Map());
      groupeMap = rootFamilies.get(f);
    }

    if (!groupeMap.has(g)) groupeMap.set(g, []);
    if (structureIdx !== null && structureIdx !== undefined) groupeMap.get(g).push(structureIdx);
  }

  window.__structureRegistry.forEach((entry, idx) => {
    // entry.domaine est un tableau (une Famille peut appartenir à plusieurs Domaines) :
    // la structure doit apparaître sous chacun d'eux, ou à la racine si aucun domaine trouvé.
    const domainesEntry = Array.isArray(entry.domaine) ? entry.domaine : (entry.domaine ? [entry.domaine] : []);
    if (domainesEntry.length === 0) {
      addToTree('', entry.famille, entry.groupe, idx);
    } else {
      domainesEntry.forEach(d => addToTree(d, entry.famille, entry.groupe, idx));
    }
  });
  // Ajoute aussi les combinaisons sans structure associée (ex : base Famille/Groupe séparée)
  (window.__allClassifPairs || []).forEach(pair => {
    addToTree(pair.domaine, pair.famille, pair.groupe, null);
  });

  function renderStructureLeaf(idx) {
    const entry = window.__structureRegistry[idx];
    return '<div class="tree-row tree-structure" onclick="window.__goToStructure(' + idx + ')">' +
      '<span class="tree-arrow"></span><span class="tree-label">📍 ' + escapeHtml(entry.nom || 'Structure') + '</span>' +
    '</div>';
  }

  function renderGroupe(groupe, idxList) {
    // Déduplique par nom normalisé : une même structure ne doit apparaître qu'une fois,
    // peu importe le nombre de visites (lignes) qui lui sont associées.
    const seenNames = new Set();
    const dedupedIdxList = idxList.filter(idx => {
      const entry = window.__structureRegistry[idx];
      const key = normalizeForSearch(entry ? entry.nom : '');
      if (seenNames.has(key)) return false;
      seenNames.add(key);
      return true;
    });

    const structuresHtml = dedupedIdxList.length > 0
      ? dedupedIdxList.map(renderStructureLeaf).join('')
      : '<div class="tree-empty-msg">Aucune structure n\'est associée aux paramètres sélectionnés.</div>';
    return (
      '<div class="tree-groupe">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(groupe) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + structuresHtml + '</div>' +
      '</div>'
    );
  }

  function renderFamille(famille, groupeMap) {
    const groupesHtml = Array.from(groupeMap.keys()).sort().map(g => renderGroupe(g, groupeMap.get(g))).join('');
    return (
      '<div class="tree-famille">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(famille) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + groupesHtml + '</div>' +
      '</div>'
    );
  }

  const domainesHtml = Array.from(domaineTree.keys()).sort().map(domaine => {
    const famMap = domaineTree.get(domaine);
    const familiesHtml = Array.from(famMap.keys()).sort()
      .map(f => renderFamille(f, famMap.get(f))).join('');
    return (
      '<div class="tree-domaine">' +
        '<div class="tree-row">' +
          '<span class="tree-arrow" onclick="window.__toggleTreeNode(this)">▸</span>' +
          '<span class="tree-label" onclick="window.__toggleTreeNode(this.previousElementSibling)">' + escapeHtml(domaine) + '</span>' +
        '</div>' +
        '<div class="tree-children">' + familiesHtml + '</div>' +
      '</div>'
    );
  }).join('');

  // Les familles sans domaine renseigné apparaissent directement à la racine (pas de niveau Domaine)
  const rootFamiliesHtml = Array.from(rootFamilies.keys()).sort()
    .map(f => renderFamille(f, rootFamilies.get(f))).join('');

  const treeHtml = domainesHtml + rootFamiliesHtml;

  panel.innerHTML =
    '<div class="structure-search-row">' +
      '<input type="text" id="structure-search-input" placeholder="Rechercher une ou des structures" oninput="window.__onStructureSearchInput(this.value)" />' +
      '<button class="structure-search-toggle" onclick="window.__toggleTreePanel()">▾</button>' +
    '</div>' +
    '<div class="structure-tree" id="structure-tree">' + treeHtml + '</div>' +
    '<div id="structure-no-result" class="structure-no-result">Aucune structure n\'est associée aux paramètres sélectionnés.</div>' +
    '<div class="structure-search-reset" onclick="window.__resetStructureSearch()">Afficher toutes les structures</div>';
}

async function drawRecords(records, mappings) {
  layerGroup.clearLayers();
  structureLayerGroup.clearLayers();
  window.__structureRegistry = [];
  const bounds = [];

  let tokenInfo = null;
  try {
    tokenInfo = await getFreshAccessToken();
  } catch (e) {
    console.error('Impossible de récupérer le jeton d\'accès Grist pour les pièces jointes :', e);
  }

  // Grilles d'évaluation : communes à toutes les structures, lues une seule fois depuis la 1ère ligne du tableau
  const grilleEvalGlobalId = 'grille-eval-global';
  if (records.length > 0) {
    const firstMapped = grist.mapColumnNames(records[0]) || records[0];
    window.__photoStore[grilleEvalGlobalId] = [
      { url: firstMapped.GrilleEval1Structure || '', desc: firstMapped.DescriptionGrilleEval1Structure || '' },
      { url: firstMapped.GrilleEval2Structure || '', desc: firstMapped.DescriptionGrilleEval2Structure || '' }
    ];
  }

  // Liste des polygones de domaine (remplie pendant leur traitement ci-dessous), utilisée ensuite
  // pour détecter automatiquement dans quel domaine se trouve chaque structure
  const domainePolygonsGlobal = [];

  // Recense TOUTES les combinaisons Domaine/Famille/Groupe de la liste de référence (colonnes dédiées,
  // séparées des colonnes Famille/Groupe des structures). Reliées entre elles par ligne (champ rapporté),
  // ce qui est légitime ici puisque c'est justement la "base" Famille/Groupe/Domaine.
  // Une famille peut appartenir à jusqu'à 5 domaines (5 colonnes) : elle apparaîtra sous chacun d'eux.
  window.__allClassifPairs = [];
  records.forEach(record => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const f = formatTextValue(mapped.FamilleRefListe).trim();
      const g = formatTextValue(mapped.GroupeRefListe).trim();
      const domaines = [
        formatTextValue(mapped.DomaineRefListe1).trim(),
        formatTextValue(mapped.DomaineRefListe2).trim(),
        formatTextValue(mapped.DomaineRefListe3).trim(),
        formatTextValue(mapped.DomaineRefListe4).trim(),
        formatTextValue(mapped.DomaineRefListe5).trim()
      ].filter(d => d !== '');

      if (domaines.length > 0) {
        domaines.forEach(d => window.__allClassifPairs.push({ domaine: d, famille: f, groupe: g }));
      } else if (f || g) {
        // Aucun domaine renseigné : la famille apparaîtra directement à la racine de l'arbre
        window.__allClassifPairs.push({ domaine: '', famille: f, groupe: g });
      }
    } catch (err) {
      // ignore silencieusement une ligne mal formée pour cette collecte annexe
    }
  });

  // Table de correspondance Famille -> Domaine(s), construite à partir du bloc de référence
  // (FamilleRefListe / DomaineRefListe1-5, placés côte à côte sur les mêmes lignes de ce bloc).
  // Sert à retrouver le(s) domaine(s) d'une structure via sa Famille (colonne "structure" à gauche),
  // SANS jamais relier ce bloc de référence (à droite) à une structure par simple position de ligne
  // (les colonnes grisées "-" séparent volontairement les deux blocs dans le tableau Grist).
  // Une Famille peut appartenir à plusieurs Domaines : la structure apparaîtra alors sous chacun d'eux.
  window.__familleToDomaines = new Map();
  (window.__allClassifPairs || []).forEach(pair => {
    const fKey = pair.famille.trim().toLowerCase();
    if (!fKey || !pair.domaine) return;
    if (!window.__familleToDomaines.has(fKey)) window.__familleToDomaines.set(fKey, new Set());
    window.__familleToDomaines.get(fKey).add(pair.domaine);
  });
  function getDomainesForFamille(famille) {
    const fKey = (famille || '').toString().trim().toLowerCase();
    if (!fKey || !window.__familleToDomaines.has(fKey)) return [];
    return Array.from(window.__familleToDomaines.get(fKey));
  }

  // Recense la liste EXHAUSTIVE des Familles et des Groupes depuis les colonnes de référence dédiées
  // (indépendantes des structures), pour que le menu déroulant propose absolument tout.
  window.__allFamilleNames = new Set();
  window.__allGroupeNames = new Set();
  records.forEach(record => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const f = formatTextValue(mapped.ListeToutesFamilles).trim();
      const g = formatTextValue(mapped.ListeTousGroupes).trim();
      if (f) window.__allFamilleNames.add(f);
      if (g) window.__allGroupeNames.add(g);
    } catch (err) {
      // ignore silencieusement
    }
  });

  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      // ------------------ Groupe "Domaine / Parc" (polygone) ------------------
      const wkt = mapped.PolygoneWKT;
      if (wkt && String(wkt).trim() !== '') {
        const polygons = parseWKT(wkt);
        domainePolygonsGlobal.push({ name: mapped.NomDomaine || 'Domaine', polygons: polygons });
        const color = mapped.CouleurDomaine || classifyMilieuColor(mapped.MilieuDomaine) || '#2e7d32'; // vert par défaut
        const nomDomaine = mapped.NomDomaine || 'Domaine';
        const superficie = mapped.SuperficieDomaine || '—';
        const protection = mapped.ProtectionDomaine || '—';

        const photoDomaineId = 'photo-domaine-' + Math.random().toString(36).slice(2);
        window.__photoStore[photoDomaineId] = [
          { url: mapped.PhotoDomaine || '', desc: mapped.DescriptionPhotoDomaine || '' }
        ];

        const domaineCardHtml =
          '<div class="structure-card">' +
            '<h3>' + escapeHtml(nomDomaine) + '</h3>' +
            '<div class="row"><b>Est. Superficie (ha) :</b> ' + escapeHtml(superficie) + '</div>' +
            '<div class="row"><b>Protection(s) :</b> ' + escapeHtml(protection) + '</div>' +
            '<div class="buttons">' +
              '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + photoDomaineId + '\', ' + jsStringLiteral(nomDomaine) + ');">📷 Photo</a>' +
            '</div>' +
          '</div>';

        polygons.forEach(rings => {
          const poly = L.polygon(rings, {
            color: color,
            fillColor: color,
            fillOpacity: 0.35,
            weight: 2
          }).addTo(layerGroup);

          poly.on('mouseover', function () { this.setStyle({ weight: 3, fillOpacity: 0.55 }); });
          poly.on('mouseout', function () { this.setStyle({ weight: 2, fillOpacity: 0.35 }); });

          attachHoverCard(poly, domaineCardHtml, { closeButton: false });

          rings.forEach(ring => ring.forEach(pt => bounds.push(pt)));
        });
      }
    } catch (err) {
      // Une erreur sur cette ligne ne doit jamais empêcher l'affichage des autres
      console.error('Erreur (domaine) lors du traitement de la ligne ' + index + ' :', err, record);
    }
  });

  // ------------------ Groupe "Structure" (point) : regroupement par nom / coordonnées ------------------
  // Plusieurs lignes peuvent partager le même nom et/ou les mêmes coordonnées GPS (ex : la structure
  // est décrite une fois, mais peut aussi apparaître sur plusieurs lignes).
  const structureGroups = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;
      const key = structureGroupKey(mapped);
      if (!key) return; // ni nom, ni coordonnées exploitables sur cette ligne
      if (!structureGroups.has(key)) structureGroups.set(key, []);
      structureGroups.get(key).push({ mapped, rowId: record.id });
    } catch (err) {
      console.error('Erreur (regroupement structure) ligne ' + index + ' :', err, record);
    }
  });

  // Table de correspondance : nom de structure normalisé -> clé de groupe (pour relier les visites par nom)
  const nameToGroupKey = new Map();
  structureGroups.forEach((entries, key) => {
    entries.forEach(e => {
      const name = (e.mapped.NomStructure || '').toString().trim().toLowerCase();
      if (name && !nameToGroupKey.has(name)) nameToGroupKey.set(name, key);
    });
  });

  // ------------------ Visites : collectées sur TOUTES les lignes, reliées par nom (pas par position de ligne) ------------------
  // Une visite est reliée à sa structure via le champ "Nom complet structure" qui doit correspondre
  // (au nom près, insensible à la casse/espaces) au champ "Nom" de la structure.
  const visitsByGroupKey = new Map();
  records.forEach((record, index) => {
    try {
      const mapped = grist.mapColumnNames(record) || record;

      const ficheInspecteurs = formatTextValue(mapped.InspecteursFiche);
      const ficheDate = mapped.DateVisiteFiche || '';
      const ficheNomComplet = mapped.NomCompletStructureFiche || '';
      const ficheDescription = mapped.DescriptionFiche || '';
      const ficheEtatStructurel = mapped.EtatStructurelFiche || '';
      const ficheEtatSecurite = mapped.EtatSecuriteUsagerFiche || '';
      const fichePhotos = [
        { url: mapped.PhotoFiche1 || '', desc: mapped.DescriptionPhotoFiche1 || '' },
        { url: mapped.PhotoFiche2 || '', desc: mapped.DescriptionPhotoFiche2 || '' },
        { url: mapped.PhotoFiche3 || '', desc: mapped.DescriptionPhotoFiche3 || '' },
        { url: mapped.PhotoFiche4 || '', desc: mapped.DescriptionPhotoFiche4 || '' },
        { url: mapped.PhotoFiche5 || '', desc: mapped.DescriptionPhotoFiche5 || '' }
      ];
      const fichePhotoPresente = fichePhotos.some(p => Array.isArray(p.url) ? p.url.length > 0 : !!p.url);
      const ficheExiste = !!(ficheInspecteurs || ficheDate || ficheNomComplet || ficheDescription ||
        ficheEtatStructurel || ficheEtatSecurite || fichePhotoPresente);
      if (!ficheExiste) return; // cette ligne ne contient aucune donnée de visite

      const normalizedName = ficheNomComplet.toString().trim().toLowerCase();
      if (!normalizedName) {
        console.warn('Visite ligne ' + index + ' ignorée : le champ "Nom complet structure" est vide, impossible de la relier à une structure.', record);
        return;
      }
      const matchedKey = nameToGroupKey.get(normalizedName);
      if (!matchedKey) {
        console.warn('Visite ligne ' + index + ' ignorée : aucune structure ne correspond au nom "' + ficheNomComplet + '".', record);
        return;
      }

      if (!visitsByGroupKey.has(matchedKey)) visitsByGroupKey.set(matchedKey, []);
      visitsByGroupKey.get(matchedKey).push({
        parsedDate: parseVisitDate(ficheDate),
        label: formatVisitLabel(ficheDate),
        data: {
          inspecteurs: ficheInspecteurs,
          date: ficheDate,
          nomComplet: ficheNomComplet,
          description: ficheDescription,
          etatStructurel: ficheEtatStructurel,
          etatSecurite: ficheEtatSecurite,
          photos: fichePhotos
        }
      });
    } catch (err) {
      console.error('Erreur (collecte visite) ligne ' + index + ' :', err, record);
    }
  });

  structureGroups.forEach((entries, key) => {
    try {
      // Choisit l'entrée "principale" : la première du groupe qui a des coordonnées valides
      let primary = null;
      for (const e of entries) {
        const la = parseFrenchNumber(e.mapped.Latitude);
        const lo = parseFrenchNumber(e.mapped.Longitude);
        if (Number.isFinite(la) && Number.isFinite(lo) && !(la === 0 && lo === 0)) {
          primary = { mapped: e.mapped, rowId: e.rowId, lat: la, lng: lo };
          break;
        }
      }
      if (!primary) return; // aucune coordonnée valide dans tout le groupe

      const mapped = primary.mapped;
      const rowId = primary.rowId;
      const lat = primary.lat;
      const lng = primary.lng;

      const color = mapped.CouleurStructure || null; // null -> rouge par défaut dans createStructureIcon
      const nom = mapped.NomStructure || 'Structure';
      const imageSrc = resolveImageValue(mapped.ImageStructure, tokenInfo);

      // Domaine(s) de cette structure : retrouvé(s) via sa Famille dans le bloc de référence
      // (une Famille peut appartenir à plusieurs Domaines), jamais lu directement sur cette ligne.
      const familleStructureNom = formatTextValue(mapped.FamilleStructure);
      const domainesStructure = getDomainesForFamille(familleStructureNom);

      // Enregistre cette structure dans le registre global (utilisé par le panneau de recherche)
      window.__structureRegistry.push({
        marker: null, // renseigné juste après la création du marqueur
        rowId: rowId, // identifiant de la ligne Grist "principale" de cette structure (utilisé par le calendrier)
        nom: nom,
        domaine: domainesStructure, // tableau : une Famille peut appartenir à plusieurs Domaines
        famille: familleStructureNom,
        groupe: formatTextValue(mapped.GroupeStructure)
      });
      const registryEntry = window.__structureRegistry[window.__structureRegistry.length - 1];

      const marker = L.marker([lat, lng], {
        icon: createStructureIcon(imageSrc, color)
      }).addTo(structureLayerGroup);
      registryEntry.marker = marker;

      const domaineAuto = findDomaineForPoint(lat, lng, domainePolygonsGlobal);
      const domaineGeo = domaineAuto || mapped.DomaineStructure || '—';
      const classifDomaine = domainesStructure.length > 0 ? domainesStructure.join(', ') : '—';
      const classifFamille = familleStructureNom || '—';
      const classifGroupe = formatTextValue(mapped.GroupeStructure) || '—';
      const lienFiche = mapped.LienFicheStructure || '';
      const lienFormulaire = mapped.LienFormulaireStructure || '';
      const lienMaps = 'https://www.google.com/maps?q=' + lat + ',' + lng;

      // Visites reliées à cette structure par nom (collectées indépendamment de la position de ligne)
      const visits = visitsByGroupKey.get(key) || [];

      // Trie les visites de la plus récente à la plus ancienne (les dates non reconnues passent en dernier)
      visits.sort((a, b) => {
        if (a.parsedDate && b.parsedDate) return b.parsedDate - a.parsedDate;
        if (a.parsedDate) return -1;
        if (b.parsedDate) return 1;
        return 0;
      });

      // État et Sécurité proviennent de la dernière visite (fiche visite la plus récente),
      // pas des colonnes de la structure elle-même : ces 2 colonnes sont liées aux visites.
      const derniereVisite = visits.length > 0 ? visits[0] : null;
      const etat = (derniereVisite && derniereVisite.data.etatStructurel) || '—';
      const securite = (derniereVisite && derniereVisite.data.etatSecurite) || '—';

      // Bouton "Voir la/les fiche(s)" : libellé au singulier ou pluriel selon le nombre de visites
      const warningId = 'warn-' + Math.random().toString(36).slice(2);
      const labelBouton = visits.length > 1 ? '📄 Voir les fiches visites' : '📄 Voir la fiche visite';
      let btnFiche, warningBox;

      if (lienFiche) {
        btnFiche = '<a class="btn btn-fiche" href="' + escapeHtml(lienFiche) + '" target="_blank" rel="noopener">' + labelBouton + '</a>';
        warningBox = '';
      } else if (visits.length > 0) {
        const ficheGroupId = 'fiche-group-' + Math.random().toString(36).slice(2);
        window.__ficheStore[ficheGroupId] = { visits: visits };
        btnFiche = '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showFicheModal(\'' + ficheGroupId + '\');">' + labelBouton + '</a>';
        warningBox = '';
      } else {
        btnFiche = '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); document.getElementById(\'' + warningId + '\').classList.add(\'visible\');">' + labelBouton + '</a>';
        warningBox = '<div class="warning-box" id="' + warningId + '">Il n\'existe aucune fiche liée à cet ouvrage, veuillez en créer une pour accéder à ce paramètre.</div>';
      }

      // Stockage des 4 emplacements photo "initiale" de la structure (pris sur l'entrée principale)
      const photoStructureId = 'photo-structure-' + Math.random().toString(36).slice(2);
      window.__photoStore[photoStructureId] = [
        { url: mapped.Photo1Structure || '', desc: mapped.DescriptionPhoto1Structure || '' },
        { url: mapped.Photo2Structure || '', desc: mapped.DescriptionPhoto2Structure || '' },
        { url: mapped.Photo3Structure || '', desc: mapped.DescriptionPhoto3Structure || '' },
        { url: mapped.Photo4Structure || '', desc: mapped.DescriptionPhoto4Structure || '' }
      ];

      const cardHtml =
        '<div class="structure-card">' +
          '<h3>' + escapeHtml(nom) + '</h3>' +
          '<div class="structure-num">Structure n°' + escapeHtml(rowId) + '</div>' +
          '<div class="row"><b>Domaine géographique :</b> ' + escapeHtml(domaineGeo) + '</div>' +
          '<div class="row"><b>Domaine :</b> ' + escapeHtml(classifDomaine) + '</div>' +
          '<div class="row"><b>Famille :</b> ' + escapeHtml(classifFamille) + '</div>' +
          '<div class="row"><b>Groupe :</b> ' + escapeHtml(classifGroupe) + '</div>' +
          '<div class="row"><b>État :</b> ' + escapeHtml(etat) + '</div>' +
          '<div class="row"><b>Sécurité :</b> ' + escapeHtml(securite) + '</div>' +
          '<div class="buttons">' +
            btnFiche +
            (lienFormulaire ? '<a class="btn btn-form" href="' + escapeHtml(lienFormulaire) + '" target="_blank" rel="noopener">➕ Créer une fiche visite</a>' : '') +
            '<a class="btn btn-maps" href="' + lienMaps + '" target="_blank" rel="noopener">🧭 Naviguer</a>' +
            '<a class="btn btn-fiche" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + photoStructureId + '\', ' + jsStringLiteral(nom) + ');">📷 Photo(s) initial de la structure</a>' +
            '<a class="btn btn-form" href="#" onclick="event.preventDefault(); window.showPhotoModal(\'' + grilleEvalGlobalId + '\', ' + jsStringLiteral('Grilles d\'évaluation') + ');">📋 Grilles d\'évaluation Etat structurel / Etat sécurité usagers</a>' +
          '</div>' +
          warningBox +
        '</div>';

      attachHoverCard(marker, cardHtml);

      bounds.push([lat, lng]);
    } catch (err) {
      console.error('Erreur lors du traitement du groupe de structure "' + key + '" :', err);
    }
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [20, 20] });
  }

  buildSearchPanel();
}

// Charge la planification du calendrier depuis les options du widget (persistée par Grist, sans colonne de table),
// et se met à jour automatiquement si elle est modifiée ailleurs (autre utilisateur, autre session).
try {
  grist.onOptions(function (options) {
    if (options && options.visitPlanning && Object.keys(options.visitPlanning).length > 0) {
      window.__visitPlanning = options.visitPlanning;
    } else {
      // Rien d'enregistré côté Grist : on tente de récupérer une éventuelle sauvegarde de secours locale
      try {
        const backup = localStorage.getItem('cerema-visit-planning-backup');
        window.__visitPlanning = backup ? JSON.parse(backup) : {};
      } catch (err) {
        window.__visitPlanning = {};
      }
    }
    if (document.getElementById('calendar-modal-overlay')) renderCalendarMonth();
  });
} catch (err) {
  console.error('grist.onOptions indisponible : la planification du calendrier ne pourra pas être sauvegardée.', err);
}
